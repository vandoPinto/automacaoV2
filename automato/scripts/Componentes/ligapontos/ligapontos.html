<style>
    .ligapontos {
        --ligapontos-linha: #3d78a8;
        --ligapontos-texto: #263746;
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 18px 0;
        color: var(--ligapontos-texto);
        font-family: inherit;
    }

    .ligapontos,
    .ligapontos * {
        box-sizing: border-box;
    }

    .ligapontos-conteudo-anterior {
        width: 100%;
        margin: 0 0 16px;
        overflow-wrap: anywhere;
    }

    .ligapontos-conteudo-anterior:empty {
        display: none;
    }

    .ligapontos-area {
        position: relative;
        width: 100%;
        min-width: 0;
        padding: 4px 0;
    }

    .ligapontos-svg {
        position: absolute;
        z-index: 1;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
    }

    .ligapontos-linha {
        fill: none;
        stroke: var(--ligapontos-linha);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
    }

    .ligapontos-colunas {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        /* Espaço central amplo para as linhas de conexão. */
        column-gap: clamp(80px, 18vw, 300px);
        align-items: stretch;
        width: 100%;
        min-width: 0;
    }

    .ligapontos-coluna {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .ligapontos-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        min-height: 44px;
    }

    .ligapontos-item-opcao {
        justify-content: flex-end;
    }

    .ligapontos-item-resposta {
        justify-content: flex-start;
    }

    .ligapontos-conteudo {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font-size: 16px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        box-shadow: none;
    }

    /* Opções alinhadas à direita; respostas alinhadas à esquerda. */
    .ligapontos-item-opcao .ligapontos-conteudo {
        text-align: right;
    }

    .ligapontos-item-resposta .ligapontos-conteudo {
        text-align: left;
    }

    .ligapontos-conteudo > :first-child {
        margin-top: 0;
    }

    .ligapontos-conteudo > :last-child {
        margin-bottom: 0;
    }

    .ligapontos-conteudo img,
    .ligapontos-conteudo video,
    .ligapontos-conteudo iframe,
    .ligapontos-conteudo svg {
        max-width: 100%;
    }

    .ligapontos-conteudo img,
    .ligapontos-conteudo video {
        height: auto;
    }

    .ligapontos-ponto {
        position: relative;
        flex: 0 0 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        min-width: 34px;
        min-height: 34px;
        margin: 0;
        padding: 0;
        border: 2px solid var(--ligapontos-linha);
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: background-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .ligapontos-ponto::after {
        content: "";
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ligapontos-linha);
        transform: scale(0);
        transition: transform .15s ease;
    }

    .ligapontos-ponto[aria-pressed="true"]::after,
    .ligapontos-ponto[data-conectado="true"]::after {
        transform: scale(1);
    }

    .ligapontos-ponto[aria-pressed="true"] {
        background: #e8f1f8;
        box-shadow: 0 0 0 4px rgba(61, 120, 168, .15);
    }

    .ligapontos-ponto:focus-visible,
    .ligapontos-submeter:focus-visible {
        outline: 3px solid rgba(61, 120, 168, .35);
        outline-offset: 3px;
    }

    .ligapontos-ponto:disabled {
        cursor: default;
        opacity: .82;
    }

    .ligapontos-acoes {
        display: flex;
        justify-content: center;
        width: 100%;
        min-height: 46px;
        margin-top: 24px;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease, visibility 0s linear .18s;
    }

    .ligapontos-acoes.is-visivel {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        transition-delay: 0s;
    }

    .ligapontos-submeter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 190px;
        min-height: 46px;
        margin: 0;
        padding: 11px 24px;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 8px;
        background: var(--cor-principal);
        color: #fff !important;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(20, 48, 72, .16);
        transition: background-color .2s ease, box-shadow .2s ease, transform .2s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .ligapontos-submeter:hover:not(:disabled) {
        filter: brightness(1.08);
        box-shadow: 0 5px 12px rgba(20, 48, 72, .2);
        transform: translateY(-2px);
    }

    .ligapontos-submeter:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 1px 3px rgba(20, 48, 72, .16);
    }

    .ligapontos-submeter:disabled {
        cursor: not-allowed;
        opacity: .48;
        box-shadow: none;
    }

    .ligapontos-feedback[hidden] {
        display: none !important;
    }

    .ligapontos-feedback {
        position: fixed;
        z-index: 100000;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, .72);
        box-sizing: border-box;
    }

    .ligapontos-feedback-conteudo {
        position: relative;
        width: fit-content;
        max-width: min(90%, 700px);
        min-width: 0;
        max-height: min(90%, 650px);
        padding: 42px 28px 28px;
        overflow-x: hidden;
        overflow-y: auto;
        border-radius: 10px;
        background: var(--cor-principal);
        box-shadow: 0 8px 28px rgba(0, 0, 0, .3);
        color: #fff;
        text-align: center;
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, .65) transparent;
    }

    .ligapontos-feedback-conteudo::-webkit-scrollbar { width: 6px; }
    .ligapontos-feedback-conteudo::-webkit-scrollbar-thumb {
        border-radius: 10px;
        background: rgba(255, 255, 255, .65);
    }

    .ligapontos-feedback-texto,
    .ligapontos-feedback-texto p,
    .ligapontos-feedback-texto span,
    .ligapontos-feedback-texto strong,
    .ligapontos-feedback-texto li,
    .ligapontos-feedback-texto div {
        color: #fff !important;
        text-align: center;
    }

    .ligapontos-feedback-texto {
        width: 100%;
        line-height: 1.55;
        overflow-wrap: anywhere;
    }

    .ligapontos-feedback-texto p { margin: 0 0 10px; }
    .ligapontos-feedback-texto p:last-child { margin-bottom: 0; }

    .ligapontos-feedback-fechar {
        position: absolute;
        top: 7px;
        right: 10px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #fff;
        font-family: inherit;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
    }

    .ligapontos-feedback-fechar:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
    }

    .ligapontos-status-acessivel {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    @media (min-width: 601px) and (max-width: 900px) {
        .ligapontos-colunas {
            column-gap: clamp(48px, 10vw, 120px);
        }

        .ligapontos-coluna {
            gap: 8px;
        }

        .ligapontos-conteudo {
            font-size: 16px;
        }
    }

    @media (max-width: 600px) {
        .ligapontos {
            margin: 14px 0;
        }

        .ligapontos-colunas {
            /* Mais espaço central no celular para as linhas se cruzarem com clareza. */
            column-gap: clamp(64px, 12vw, 100px);
        }

        .ligapontos-coluna {
            gap: 8px;
        }

        .ligapontos-item {
            gap: 6px;
            min-height: 48px;
        }

        .ligapontos-conteudo {
            font-size: 16px;
            line-height: 1.4;
        }

        .ligapontos-feedback {
            padding: 14px;
        }

        .ligapontos-feedback-conteudo {
            max-width: 100%;
            max-height: 90%;
            padding: 40px 18px 22px;
        }

        .ligapontos-ponto {
            flex-basis: 32px;
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
        }

        .ligapontos-ponto::after {
            width: 7px;
            height: 7px;
        }

        .ligapontos-submeter {
            width: 100%;
            min-width: 0;
            min-height: 44px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .ligapontos-ponto,
        .ligapontos-ponto::after,
        .ligapontos-acoes,
        .ligapontos-submeter,
        .ligapontos-feedback-fechar {
            transition: none;
        }
    }
</style>

<section class="ligapontos" id="{{ID_INSTANCIA}}" data-ligapontos-instancia="{{ID_INSTANCIA}}" aria-label="Atividade de ligar pontos">
    <div class="ligapontos-conteudo-anterior">{{CONTEUDO_ANTERIOR}}</div>

    <div class="ligapontos-area" data-ligapontos-area>
        <svg class="ligapontos-svg" data-ligapontos-svg aria-hidden="true" focusable="false"></svg>
        <div class="ligapontos-colunas">
            <div class="ligapontos-coluna ligapontos-lista-opcoes" role="group" aria-label="Opções">
                {{OPCOES}}
            </div>
            <div class="ligapontos-coluna ligapontos-lista-respostas" role="group" aria-label="Respostas">
                {{RESPOSTAS}}
            </div>
        </div>
    </div>

    <div class="ligapontos-acoes" data-ligapontos-acoes aria-hidden="true">
        <button class="ligapontos-submeter" type="button" data-ligapontos-submeter disabled>Submeter</button>
    </div>

    <div class="ligapontos-feedback" data-ligapontos-feedback role="presentation" aria-hidden="true" hidden>
        <div class="ligapontos-feedback-conteudo" data-ligapontos-feedback-conteudo role="dialog" aria-modal="true" aria-label="Feedback da atividade">
            <button class="ligapontos-feedback-fechar" data-ligapontos-feedback-fechar type="button" aria-label="Fechar feedback">×</button>
            <div class="ligapontos-feedback-texto" data-ligapontos-feedback-texto aria-live="polite">
                <div class="ligapontos-feedback-certo" data-ligapontos-feedback-certo data-audio-id="{{AUDIO_CERTO}}" hidden>{{FEEDBACK_CERTO}}</div>
                <div class="ligapontos-feedback-errado" data-ligapontos-feedback-errado data-audio-id="{{AUDIO_ERRADO}}" hidden>{{FEEDBACK_ERRADO}}</div>
            </div>
        </div>
    </div>

    <div class="ligapontos-status-acessivel" data-ligapontos-status aria-live="polite" tabindex="-1"></div>
</section>

<script>
(function () {
    "use strict";

    var instanciaId = "{{ID_INSTANCIA}}";
    var raiz = document.getElementById(instanciaId);
    if (!raiz || raiz.getAttribute("data-ligapontos-inicializado") === "true") return;
    raiz.setAttribute("data-ligapontos-inicializado", "true");

    function elementosDaRaiz(seletor) {
        return Array.prototype.filter.call(raiz.querySelectorAll(seletor), function (elemento) {
            return elemento.closest(".ligapontos") === raiz;
        });
    }

    function elementoDaRaiz(seletor) {
        return elementosDaRaiz(seletor)[0] || null;
    }

    var area = elementoDaRaiz("[data-ligapontos-area]");
    var svg = elementoDaRaiz("[data-ligapontos-svg]");
    var listaRespostas = elementoDaRaiz(".ligapontos-lista-respostas");
    var pontos = elementosDaRaiz(".ligapontos-ponto");
    var opcoes = pontos.filter(function (ponto) { return ponto.getAttribute("data-ligapontos-lado") === "opcao"; });
    var respostas = pontos.filter(function (ponto) { return ponto.getAttribute("data-ligapontos-lado") === "resposta"; });
    var acoesSubmeter = elementoDaRaiz("[data-ligapontos-acoes]");
    var botaoSubmeter = elementoDaRaiz("[data-ligapontos-submeter]");
    var feedback = elementoDaRaiz("[data-ligapontos-feedback]");
    var feedbackCerto = elementoDaRaiz("[data-ligapontos-feedback-certo]");
    var feedbackErrado = elementoDaRaiz("[data-ligapontos-feedback-errado]");
    var botaoFecharFeedback = elementoDaRaiz("[data-ligapontos-feedback-fechar]");
    var conteudoFeedback = elementoDaRaiz("[data-ligapontos-feedback-conteudo]");
    var statusAcessivel = elementoDaRaiz("[data-ligapontos-status]");

    var conexoes = new Map();
    var opcaoSelecionada = null;
    var concluido = false;
    var ultimaVisibilidade = null;
    var observadorMutacoes = null;
    var observadorTamanho = null;
    var focoAntesDoFeedback = null;

    // Como a janela do componente Botões, o feedback é colocado diretamente
    // no body para não ser recortado por contêineres com overflow ou transform.
    if (feedback && document.body && feedback.parentElement !== document.body) {
        document.body.appendChild(feedback);
    }

    function dispararEventoAudio(nome, detalhe) {
        document.dispatchEvent(new CustomEvent(nome, { detail: detalhe || {} }));
    }

    function atualizarBotaoSubmeter() {
        var conexoesCompletas = opcoes.length > 0 && conexoes.size === opcoes.length;
        if (acoesSubmeter) {
            acoesSubmeter.classList.toggle("is-visivel", conexoesCompletas);
            acoesSubmeter.setAttribute("aria-hidden", conexoesCompletas ? "false" : "true");
        }
        botaoSubmeter.disabled = concluido || !conexoesCompletas;
    }

    function pontoPorLadoEId(lado, id) {
        return pontos.find(function (ponto) {
            return ponto.getAttribute("data-ligapontos-lado") === lado &&
                ponto.getAttribute("data-ligapontos-id") === String(id);
        });
    }

    function limparSelecao() {
        opcaoSelecionada = null;
        opcoes.forEach(function (ponto) {
            ponto.setAttribute("aria-pressed", "false");
        });
    }

    function ocultarFeedback(interromperAudio, restaurarFoco) {
        var estavaAberto = !feedback.hidden;
        if (estavaAberto && interromperAudio !== false) dispararEventoAudio("stopAudio");
        feedback.hidden = true;
        feedback.setAttribute("aria-hidden", "true");
        feedbackCerto.hidden = true;
        feedbackErrado.hidden = true;

        if (restaurarFoco) {
            var alvo = focoAntesDoFeedback && !focoAntesDoFeedback.disabled
                ? focoAntesDoFeedback
                : (!concluido ? opcoes.find(function (ponto) { return !ponto.disabled; }) : statusAcessivel);
            if (alvo && typeof alvo.focus === "function") alvo.focus();
        }
        focoAntesDoFeedback = null;
    }

    function elevarFeedbackParaCamadaGlobal() {
        if (!feedback || !document.body) return;

        // Reanexa o feedback no momento da abertura, não apenas na inicialização.
        // Isso garante que ele fique depois da janela pai no DOM, mesmo quando
        // o componente foi processado antes de o Botão criar seu próprio portal.
        if (feedback.parentElement !== document.body || feedback.nextElementSibling) {
            document.body.appendChild(feedback);
        }

        // Não basta usar um z-index alto fixo: o feedback precisa ficar acima
        // de qualquer diálogo que já esteja aberto (Botão ou outro componente).
        var maiorZIndex = 100000;
        var camadasAtivas = document.querySelectorAll('[aria-modal="true"], .botao-janela, .ligapontos-feedback');

        Array.prototype.forEach.call(camadasAtivas, function (camada) {
            if (camada === feedback || camada.hidden || camada.getAttribute("aria-hidden") === "true") return;
            var zIndex = window.getComputedStyle(camada).zIndex;
            var valor = parseInt(zIndex, 10);
            if (Number.isFinite(valor) && valor > maiorZIndex) maiorZIndex = valor;
        });

        feedback.style.zIndex = String(maiorZIndex + 1);
    }

    function mostrarFeedback() {
        focoAntesDoFeedback = document.activeElement || botaoSubmeter;
        elevarFeedbackParaCamadaGlobal();
        feedback.hidden = false;
        feedback.setAttribute("aria-hidden", "false");
        if (botaoFecharFeedback && typeof botaoFecharFeedback.focus === "function") {
            botaoFecharFeedback.focus();
        }
    }

    function atualizarEstadoPontos() {
        pontos.forEach(function (ponto) {
            var lado = ponto.getAttribute("data-ligapontos-lado");
            var id = ponto.getAttribute("data-ligapontos-id");
            var conectado = lado === "opcao"
                ? conexoes.has(id)
                : Array.from(conexoes.values()).indexOf(id) !== -1;
            ponto.setAttribute("data-conectado", conectado ? "true" : "false");
            ponto.disabled = concluido;
        });
        limparSelecao();
        atualizarBotaoSubmeter();
    }

    function obterCentro(ponto) {
        if (!ponto) return null;
        var caixaArea = area.getBoundingClientRect();
        var caixaPonto = ponto.getBoundingClientRect();
        if (!caixaPonto.width || !caixaPonto.height || !caixaArea.width || !caixaArea.height) return null;
        return {
            x: caixaPonto.left + caixaPonto.width / 2 - caixaArea.left,
            y: caixaPonto.top + caixaPonto.height / 2 - caixaArea.top
        };
    }

    function desenharConexoes() {
        if (!area || !svg) return;
        var largura = area.clientWidth;
        var altura = area.scrollHeight;
        if (!largura || !altura) {
            svg.setAttribute("viewBox", "0 0 1 1");
            svg.innerHTML = "";
            return;
        }

        svg.setAttribute("viewBox", "0 0 " + largura + " " + altura);
        svg.setAttribute("width", largura);
        svg.setAttribute("height", altura);
        svg.innerHTML = "";

        conexoes.forEach(function (idResposta, idOpcao) {
            var origem = obterCentro(pontoPorLadoEId("opcao", idOpcao));
            var destino = obterCentro(pontoPorLadoEId("resposta", idResposta));
            if (!origem || !destino) return;

            var distancia = Math.max(24, Math.abs(destino.x - origem.x) * 0.42);
            var curva = document.createElementNS("http://www.w3.org/2000/svg", "path");
            curva.setAttribute("class", "ligapontos-linha");
            curva.setAttribute("d", "M " + origem.x + " " + origem.y +
                " C " + (origem.x + distancia) + " " + origem.y + "," +
                (destino.x - distancia) + " " + destino.y + "," +
                destino.x + " " + destino.y);
            svg.appendChild(curva);
        });
    }

    function limparConexaoDaOpcao(idOpcao) {
        if (conexoes.has(idOpcao)) conexoes.delete(idOpcao);
    }

    function embaralharRespostas() {
        var itens = Array.prototype.slice.call(listaRespostas.children);
        // Fisher-Yates: a ordem visual muda sem alterar os identificadores
        // internos que definem a correspondência correta.
        for (var i = itens.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temporario = itens[i];
            itens[i] = itens[j];
            itens[j] = temporario;
        }
        itens.forEach(function (item) { listaRespostas.appendChild(item); });
    }

    function reiniciarAoEntrar() {
        conexoes.clear();
        concluido = false;
        limparSelecao();
        ocultarFeedback(true);
        embaralharRespostas();
        atualizarEstadoPontos();
        desenharConexoes();
    }

    function selecionarOpcao(ponto) {
        if (concluido) return;
        // Começar uma nova tentativa interrompe o áudio do feedback anterior.
        ocultarFeedback(true);
        var id = ponto.getAttribute("data-ligapontos-id");

        if (opcaoSelecionada === id) {
            limparSelecao();
            statusAcessivel.textContent = "Seleção cancelada.";
            return;
        }

        opcaoSelecionada = id;
        opcoes.forEach(function (item) {
            item.setAttribute("aria-pressed", item === ponto ? "true" : "false");
        });
        statusAcessivel.textContent = "Opção " + id + " selecionada. Escolha uma resposta.";
    }

    function selecionarResposta(ponto) {
        if (concluido) return;
        var idResposta = ponto.getAttribute("data-ligapontos-id");

        if (opcaoSelecionada === null) {
            // Clicar em uma resposta já conectada remove somente essa ligação.
            var opcaoConectada = null;
            conexoes.forEach(function (valor, chave) {
                if (valor === idResposta) opcaoConectada = chave;
            });
            if (opcaoConectada !== null) {
                conexoes.delete(opcaoConectada);
                ocultarFeedback(true);
                atualizarEstadoPontos();
                desenharConexoes();
                statusAcessivel.textContent = "Ligação removida.";
            }
            return;
        }

        // Uma resposta já ocupada não é tomada automaticamente de outra
        // opção. Isso preserva ligações corretas durante a edição; para liberar
        // o ponto, o estudante pode clicar nele sem ter uma opção selecionada.
        var opcaoQueUsaResposta = null;
        conexoes.forEach(function (valor, chave) {
            if (valor === idResposta) opcaoQueUsaResposta = chave;
        });
        if (opcaoQueUsaResposta !== null && opcaoQueUsaResposta !== opcaoSelecionada) {
            statusAcessivel.textContent = "Esta resposta já está conectada. Selecione o ponto dela sem uma opção ativa para remover a ligação primeiro.";
            return;
        }

        // Garante uma única ligação por opção e por resposta.
        limparConexaoDaOpcao(opcaoSelecionada);
        conexoes.set(opcaoSelecionada, idResposta);

        ocultarFeedback(true);
        limparSelecao();
        atualizarEstadoPontos();
        desenharConexoes();
        statusAcessivel.textContent = "Ligação criada.";
    }

    function submeterRespostas() {
        if (concluido || conexoes.size !== opcoes.length) return;
        var incorretas = [];

        opcoes.forEach(function (ponto) {
            var idOpcao = ponto.getAttribute("data-ligapontos-id");
            if (conexoes.get(idOpcao) !== idOpcao) incorretas.push(idOpcao);
        });

        dispararEventoAudio("stopAudio");
        mostrarFeedback();

        if (!incorretas.length) {
            concluido = true;
            feedbackCerto.hidden = false;
            feedbackErrado.hidden = true;
            statusAcessivel.textContent = "Todas as associações estão corretas.";
            atualizarEstadoPontos();
            var audioCerto = feedbackCerto.getAttribute("data-audio-id");
            if (audioCerto) dispararEventoAudio("playAudio", { comp: audioCerto });
            return;
        }

        incorretas.forEach(function (idOpcao) { conexoes.delete(idOpcao); });
        feedbackCerto.hidden = true;
        feedbackErrado.hidden = false;
        statusAcessivel.textContent = incorretas.length +
            (incorretas.length === 1 ? " ligação incorreta foi removida." : " ligações incorretas foram removidas.");
        atualizarEstadoPontos();
        desenharConexoes();
        var audioErrado = feedbackErrado.getAttribute("data-audio-id");
        if (audioErrado) dispararEventoAudio("playAudio", { comp: audioErrado });
    }

    function estaVisivel() {
        var ancestral = raiz;
        while (ancestral && ancestral.nodeType === 1) {
            if (ancestral.hidden || ancestral.getAttribute("aria-hidden") === "true") return false;
            if (window.getComputedStyle) {
                var estilo = window.getComputedStyle(ancestral);
                if (estilo.display === "none" || estilo.visibility === "hidden" ||
                    Number(estilo.opacity) === 0) return false;
            }
            ancestral = ancestral.parentElement;
        }
        return Boolean(raiz.getClientRects().length && raiz.offsetWidth > 0 && raiz.offsetHeight > 0);
    }

    function verificarEntrada() {
        var visivel = estaVisivel();
        if (!visivel && !feedback.hidden) ocultarFeedback(true, false);
        if (visivel && ultimaVisibilidade !== true) reiniciarAoEntrar();
        ultimaVisibilidade = visivel;
    }

    pontos.forEach(function (ponto) {
        ponto.addEventListener("click", function () {
            if (ponto.getAttribute("data-ligapontos-lado") === "opcao") selecionarOpcao(ponto);
            else selecionarResposta(ponto);
        });
    });

    botaoSubmeter.addEventListener("click", submeterRespostas);

    if (botaoFecharFeedback) {
        botaoFecharFeedback.addEventListener("click", function () {
            ocultarFeedback(true, true);
        });
    }

    if (feedback) {
        feedback.addEventListener("click", function (evento) {
            if (evento.target === feedback) ocultarFeedback(true, true);
        });
    }

    if (conteudoFeedback) {
        conteudoFeedback.addEventListener("click", function (evento) {
            evento.stopPropagation();
        });
    }

    if (typeof document.addEventListener === "function") {
        document.addEventListener("keydown", function (evento) {
            if (evento.key === "Escape" && !feedback.hidden) {
                ocultarFeedback(true, true);
            }
        });
    }

    // Redesenha as ligações quando imagens carregam, o componente muda de
    // tamanho ou o dispositivo altera orientação.
    if (window.ResizeObserver) {
        observadorTamanho = new ResizeObserver(desenharConexoes);
        observadorTamanho.observe(area);
        elementosDaRaiz(".ligapontos-conteudo").forEach(function (item) {
            observadorTamanho.observe(item);
        });
    }
    raiz.addEventListener("load", desenharConexoes, true);
    window.addEventListener("resize", verificarEntrada);
    window.addEventListener("resize", desenharConexoes);
    window.addEventListener("orientationchange", desenharConexoes);

    // Ao sair e entrar novamente em uma aba/painel, a ordem das respostas é
    // refeita e a atividade volta ao estado inicial.
    if (window.MutationObserver) {
        observadorMutacoes = new MutationObserver(verificarEntrada);
        var ancestral = raiz;
        while (ancestral && ancestral.nodeType === 1) {
            observadorMutacoes.observe(ancestral, {
                attributes: true,
                attributeFilter: ["class", "style", "hidden", "aria-hidden", "aria-expanded", "open"]
            });
            ancestral = ancestral.parentElement;
        }
    }

    verificarEntrada();
    desenharConexoes();
})();
</script>
