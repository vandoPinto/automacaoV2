<style>
    /* Grupo visual dos botões: organiza as opções sem criar uma nova tela. */
    .botao-grupo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        width: 100%;
        margin: 18px 0 8px;
        box-sizing: border-box;
        justify-content: center;

    .botao-item {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        min-width: 142px;
        min-height: 56px;
        margin: 0;
        padding: 12px 20px;

        color: #fff !important;
        font-family: inherit;
        font-size: clamp(15px, 1vw, 18px);
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(20, 48, 72, .16);

        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;

        filter: brightness(1.08);
        box-shadow: 0 5px 12px rgba(20, 48, 72, .2);
        transform: translateY(-2px);

    .botao-item:active {
        transform: translateY(0);
        box-shadow: 0 1px 3px rgba(20, 48, 72, .16);
    }

    .botao-item[aria-expanded="true"] {
        filter: brightness(.88);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .2);
    }

    .botao-item img,
    .botao-item svg,
    .botao-item picture {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;

    .botao-item p { margin: 0; }

    .botao-item:focus-visible,

        height: auto;
        max-width: min(34vw, 350px);
        max-height: 36vh;
        object-fit: contain;
    }

    .botao-janela[hidden] { display: none !important; }

    .botao-janela {
        position: fixed;
        z-index: 100000;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, .72);
        box-sizing: border-box;
    }

    .botao-janela-conteudo {
        position: relative;
        /* A janela acompanha o conteúdo, respeitando os limites da tela. */
        width: fit-content;
        max-width: min(90%, 100%);
        min-width: 0;
        max-height: min(90%, 650px);
        padding: 34px 28px 26px;
        overflow-x: hidden;
        overflow-y: auto;
        border-radius: 10px;
        background: var(--cor-principal);
        box-shadow: 0 8px 28px rgba(0, 0, 0, .3);
        color: #fff;
        text-align: left;
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, .65) transparent;

        min-height: min(35vh, 360px);

        display: block;

<script>
    (function () {
        var instanciaId = "{{ID_INSTANCIA}}";
        var prefixoAudio = "{{PREFIXO_AUDIO}}";
        var seletor = '[data-botao-instancia="' + instanciaId + '"]';
        var elementos = Array.prototype.slice.call(document.querySelectorAll(seletor));
        var botoes = elementos.filter(function (elemento) {
            return elemento.classList.contains("botao-item");
        });
        var janelas = elementos.filter(function (elemento) {
            return elemento.classList.contains("botao-janela");
        });

        // Portais no body impedem que transformações de componentes-pai
        // (como as faces do Flashcard) restrinjam o modal à área do cartão.
        janelas.forEach(function (janela) {
            if (janela.parentNode !== document.body) {
                document.body.appendChild(janela);
            }
        });

        // Organiza texto e imagem na ordem do roteiro, sem entrar nem alterar
        // a estrutura de um componente filho que já esteja dentro da janela.
        var tagsTexto = new Set([
            "P", "H1", "H2", "H3", "H4", "H5", "H6", "UL", "OL", "LI",
            "BLOCKQUOTE", "PRE", "SPAN", "STRONG", "EM", "B", "I", "U", "S",
            "DEL", "INS", "SMALL", "SUB", "SUP", "CODE", "MARK", "A", "ABBR",
            "CITE", "Q", "KBD", "SAMP", "VAR", "BR", "WBR"
        ]);
        var seletorComponente = "componente, flashcard, botao, hotword, abas, mininavegacao, sanfona, jogomemoria, opcoes, verdadeirofalso, relacionarcolunas, forca, [data-automato-componente], [class*='-componente']";

        function noContemApenasTexto(no) {
            if (no.nodeType === 3 || no.nodeType === 8) return true;
            if (no.nodeType !== 1) return false;
            if (no.tagName === "STYLE" || no.tagName === "SCRIPT") return true;
            if (!tagsTexto.has(no.tagName)) return false;
            return Array.from(no.childNodes).every(noContemApenasTexto);
        }

        function conteudoTemTextoVisual(conteudo) {
            return Boolean(conteudo.textContent.trim()) &&
                Array.from(conteudo.childNodes).every(noContemApenasTexto);
        }

        function temConteudoVisivel(elemento) {
            if (elemento.tagName === "STYLE" || elemento.tagName === "SCRIPT") return false;
            return Boolean((elemento.textContent || "").trim()) ||
                Boolean(elemento.querySelector("img, svg, video, canvas, iframe, componente, [data-automato-componente], [class*='-componente']"));
        }

        function prepararLayoutJanela(janela) {
            var conteudo = janela.querySelector(".botao-janela-texto");
            if (!conteudo || conteudo.dataset.layoutTextoImagem === "true") return;
            conteudo.dataset.layoutTextoImagem = "true";

            Array.from(conteudo.childNodes).forEach(function (no) {
                if (no.nodeType === Node.TEXT_NODE && no.textContent.trim()) {
                    var paragrafo = document.createElement("p");
                    paragrafo.textContent = no.textContent.trim();
                    conteudo.insertBefore(paragrafo, no);
                    no.remove();
                } else if (no.nodeType === Node.TEXT_NODE) {
                    no.remove();
                }
            });

            var partes = [];
            Array.from(conteudo.children).forEach(function (filho) {
                var possuiComponente = filho.matches(seletorComponente) ||
                    Boolean(filho.querySelector(seletorComponente));
                if (filho.tagName === "STYLE" || filho.tagName === "SCRIPT") {
                    partes.push({ tipo: "auxiliar", elemento: filho });
                    return;
                }

                if (!possuiComponente && ["IMG", "PICTURE", "SVG"].includes(filho.tagName)) {
                    partes.push({ tipo: "imagem", elemento: filho });
                    return;
                }

                var imagens = !possuiComponente && filho.tagName === "P"
                    ? Array.from(filho.querySelectorAll("img, picture, svg"))
                    : [];
                if (!imagens.length) {
                    partes.push({ tipo: "texto", elemento: filho, possuiComponente: possuiComponente });
                    return;
                }

                var blocoTexto = filho.cloneNode(true);
                blocoTexto.querySelectorAll("img, picture, svg").forEach(function (imagem) {
                    imagem.remove();
                });
                if (temConteudoVisivel(blocoTexto)) {
                    partes.push({ tipo: "texto", elemento: blocoTexto, possuiComponente: false });
                }
                imagens.forEach(function (imagem) {
                    partes.push({ tipo: "imagem", elemento: imagem });
                });
            });

            var imagensNaJanela = partes.some(function (parte) { return parte.tipo === "imagem"; });
            var textoNaJanela = partes.some(function (parte) {
                return parte.tipo === "texto" && temConteudoVisivel(parte.elemento);
            });

            if (!imagensNaJanela && conteudoTemTextoVisual(conteudo)) {
                conteudo.classList.add("somente-texto");
                return;
            }

            if (imagensNaJanela) {
                conteudo.classList.add("com-imagem");
                if (!textoNaJanela) conteudo.classList.add("somente-imagem");
                conteudo.replaceChildren();

                var grupoTexto = null;
                var blocoTexto = null;
                partes.forEach(function (parte) {
                    if (parte.tipo === "imagem") {
                        parte.elemento.classList.add("botao-janela-imagem-item");
                        conteudo.appendChild(parte.elemento);
                        grupoTexto = null;
                        blocoTexto = null;
                        return;
                    }
                    if (!grupoTexto) {
                        grupoTexto = document.createElement("div");
                        grupoTexto.className = "botao-janela-texto-grupo";
                        conteudo.appendChild(grupoTexto);
                    }
                    if (parte.possuiComponente) {
                        grupoTexto.classList.add("componente-aninhado");
                        grupoTexto.appendChild(parte.elemento);
                        blocoTexto = null;
                        return;
                    }
                    if (!blocoTexto) {
                        blocoTexto = document.createElement("div");
                        blocoTexto.className = "botao-janela-texto-bloco";
                        grupoTexto.appendChild(blocoTexto);
                    }
                    blocoTexto.appendChild(parte.elemento);
                });
            }
        }

        janelas.forEach(prepararLayoutJanela);

        // Integração com o serviço central de sonorização do app.js.
        // O app.js monta o nome final usando a lição/tela atuais e o valor de "comp".
        function dispararEventoAudio(nome, detalhe) {
            document.dispatchEvent(new CustomEvent(nome, {
                detail: detalhe || {}
            }));
        }

        function fecharJanela(janela, interromperAudio) {
            if (!janela) return;

            var estavaAberta = !janela.hidden;
            janela.hidden = true;
            janela.setAttribute("aria-hidden", "true");

            if (estavaAberta && interromperAudio !== false) {
                dispararEventoAudio("stopAudio");
            }

            var id = janela.getAttribute("data-botao-janela");
            var botao = botoes.find(function (item) {
                return item.getAttribute("data-botao-alvo") === id;
            });

            if (botao) {
                botao.setAttribute("aria-expanded", "false");
                botao.focus();
            }
        }

        function fecharTodas(interromperAudio) {
            var haviaJanelaAberta = janelas.some(function (janela) {
                return !janela.hidden;
            });

            janelas.forEach(function (janela) {
                janela.hidden = true;
                janela.setAttribute("aria-hidden", "true");

                var id = janela.getAttribute("data-botao-janela");
                var botao = botoes.find(function (item) {
                    return item.getAttribute("data-botao-alvo") === id;
                });
                if (botao) botao.setAttribute("aria-expanded", "false");
            });

            if (haviaJanelaAberta && interromperAudio !== false) {
                dispararEventoAudio("stopAudio");
            }
        }

        function abrirJanela(botao) {
            var id = botao.getAttribute("data-botao-alvo");
            var janela = janelas.find(function (item) {
                return item.getAttribute("data-botao-janela") === id;
            });
            if (!janela) return;

            // Fecha uma eventual janela anterior sem disparar um stop duplicado.
            fecharTodas(false);

            // Uma janela filha é movida para o body para escapar dos limites
            // do componente pai. Eleva a filha acima dos modais já abertos,
            // pois todos começam com o mesmo z-index base.
            var maiorZIndex = Array.from(document.querySelectorAll(
                ".botao-janela, .hotword-janela[data-hotword-painel], [role='dialog'][aria-modal='true']"
            ))
                .filter(function (item) {
                    return item !== janela && !item.hidden &&
                        item.getAttribute("aria-hidden") !== "true" &&
                        item.getClientRects().length > 0;
                })
                .reduce(function (maior, item) {
                    var valor = Number.parseInt(window.getComputedStyle(item).zIndex, 10);
                    return Number.isFinite(valor) ? Math.max(maior, valor) : maior;
                }, 99999);
            janela.style.zIndex = String(maiorZIndex + 1);

            // Primeiro interrompe qualquer áudio em execução.
            dispararEventoAudio("stopAudio");

            janela.hidden = false;
            janela.setAttribute("aria-hidden", "false");
            botao.setAttribute("aria-expanded", "true");

            // O identificador hierárquico já foi definido pelo processador
            // central na geração do HTML. O componente apenas o consome.
            var audioId = janela.getAttribute("data-audio-id");
            if (audioId) {
                dispararEventoAudio("playAudio", { comp: audioId });
            }

            var fechar = janela.querySelector(".botao-fechar");
            if (fechar) fechar.focus();
        }

        botoes.forEach(function (botao) {
            botao.addEventListener("click", function () {
                var id = botao.getAttribute("data-botao-alvo");
                var janela = janelas.find(function (item) {
                    return item.getAttribute("data-botao-janela") === id;
                });
                if (janela && !janela.hidden) fecharJanela(janela);
                else abrirJanela(botao);
            });
        });

        janelas.forEach(function (janela) {
            var fechar = janela.querySelector(".botao-fechar");
            if (fechar) {
                fechar.addEventListener("click", function (evento) {
                    evento.stopPropagation();
                    fecharJanela(janela);
                });
            }
            janela.addEventListener("click", function (evento) {
                if (evento.target === janela) fecharJanela(janela);
            });
        });

        document.addEventListener("keydown", function (evento) {
            if (evento.key === "Escape") fecharTodas();
        });
    })();
</script>
