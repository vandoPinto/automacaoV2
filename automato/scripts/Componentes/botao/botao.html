<style>
    /* Grupo visual dos botões: organiza as opções sem criar uma nova tela. */
    .botao-grupo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 14px;
        width: 100%;
        margin: 18px 0 8px;
        box-sizing: border-box;
    }

    .botao-item {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        min-width: 142px;
        min-height: 56px;
        margin: 0;
        padding: 12px 20px;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 8px;
        background: var(--cor-principal);
        color: #fff !important;
        font-family: inherit;
        font-size: clamp(15px, 1vw, 18px);
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(20, 48, 72, .16);
        transition: background-color .2s ease, box-shadow .2s ease, transform .2s ease;
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
    }

    .botao-item:hover {
        filter: brightness(1.08);
        box-shadow: 0 5px 12px rgba(20, 48, 72, .2);
        transform: translateY(-2px);
    }

    .botao-item:active {
        transform: translateY(0);
        box-shadow: 0 1px 3px rgba(20, 48, 72, .16);
    }

    .botao-item[aria-expanded="true"] {
        filter: brightness(.88);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .2);
    }

    .botao-item img,
    .botao-item svg,
    .botao-item picture {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
    }

    .botao-item p { margin: 0; }

    .botao-item:focus-visible,
    .botao-fechar:focus-visible {
        outline: 2px solid var(--cor-principal);
        outline-offset: 3px;
    }

    .botao-item-com-imagem {
        max-width: min(38vw, 390px);
        max-height: 42vh;
        overflow: hidden;
    }

    .botao-item-com-imagem img,
    .botao-item-com-imagem picture,
    .botao-item-com-imagem picture img {
        width: auto;
        height: auto;
        max-width: min(34vw, 350px);
        max-height: 36vh;
        object-fit: contain;
    }

    .botao-janela[hidden] { display: none !important; }

    .botao-janela {
        position: fixed;
        z-index: 99999;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, .72);
        box-sizing: border-box;
    }

    .botao-janela-conteudo {
        position: relative;
        width: min(748px, 100%);
        max-height: min(78vh, 650px);
        padding: 34px 28px 26px;
        overflow-x: hidden;
        overflow-y: auto;
        border-radius: 10px;
        background: var(--cor-principal);
        box-shadow: 0 8px 28px rgba(0, 0, 0, .3);
        color: #fff;
        text-align: left;
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, .65) transparent;
    }

    .botao-janela-conteudo::-webkit-scrollbar { width: 6px; }
    .botao-janela-conteudo::-webkit-scrollbar-thumb {
        border-radius: 10px;
        background: rgba(255, 255, 255, .65);
    }

    .botao-janela-texto,
    .botao-janela-texto p,
    .botao-janela-texto span,
    .botao-janela-texto strong,
    .botao-janela-texto li {
        color: #fff !important;
    }

    .botao-janela-texto {
        width: 100%;
        line-height: 1.55;
        overflow-wrap: anywhere;
        text-align: left;
    }

    .botao-janela-texto p { margin: 0 0 10px; }
    .botao-janela-texto p:last-child { margin-bottom: 0; }

    .botao-fechar {
        position: absolute;
        top: 7px;
        right: 10px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #fff;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        .botao-grupo {
            gap: 10px;
            margin-top: 14px;
        }

        .botao-item {
            flex: 1 1 calc(50% - 10px);
            min-width: min(125px, 100%);
            min-height: 48px;
            padding: 10px 12px;
            font-size: 15px;
        }

        .botao-item-com-imagem {
            max-width: min(80vw, 320px);
            max-height: 35vh;
        }

        .botao-item-com-imagem img,
        .botao-item-com-imagem picture,
        .botao-item-com-imagem picture img {
            max-width: 100%;
            max-height: 32vh;
        }

        .botao-janela { padding: 14px; }

        .botao-janela-conteudo {
            max-height: 82vh;
            padding: 34px 18px 22px;
        }
    }
</style>

<script>
    (function () {
        var instanciaId = "{{ID_INSTANCIA}}";
        var seletor = '[data-botao-instancia="' + instanciaId + '"]';
        var elementos = Array.prototype.slice.call(document.querySelectorAll(seletor));
        var botoes = elementos.filter(function (elemento) {
            return elemento.classList.contains("botao-item");
        });
        var janelas = elementos.filter(function (elemento) {
            return elemento.classList.contains("botao-janela");
        });

        function fecharJanela(janela) {
            if (!janela) return;
            janela.hidden = true;
            janela.setAttribute("aria-hidden", "true");

            var id = janela.getAttribute("data-botao-janela");
            var botao = botoes.find(function (item) {
                return item.getAttribute("data-botao-alvo") === id;
            });
            if (botao) {
                botao.setAttribute("aria-expanded", "false");
                botao.focus();
            }
        }

        function fecharTodas() {
            janelas.forEach(function (janela) {
                if (!janela.hidden) fecharJanela(janela);
            });
        }

        function abrirJanela(botao) {
            var id = botao.getAttribute("data-botao-alvo");
            var janela = janelas.find(function (item) {
                return item.getAttribute("data-botao-janela") === id;
            });
            if (!janela) return;

            fecharTodas();
            janela.hidden = false;
            janela.setAttribute("aria-hidden", "false");
            botao.setAttribute("aria-expanded", "true");
            var fechar = janela.querySelector(".botao-fechar");
            if (fechar) fechar.focus();
        }

        botoes.forEach(function (botao) {
            botao.addEventListener("click", function () {
                var id = botao.getAttribute("data-botao-alvo");
                var janela = janelas.find(function (item) {
                    return item.getAttribute("data-botao-janela") === id;
                });
                if (janela && !janela.hidden) fecharJanela(janela);
                else abrirJanela(botao);
            });
        });

        janelas.forEach(function (janela) {
            var fechar = janela.querySelector(".botao-fechar");
            if (fechar) {
                fechar.addEventListener("click", function (evento) {
                    evento.stopPropagation();
                    fecharJanela(janela);
                });
            }
            janela.addEventListener("click", function (evento) {
                if (evento.target === janela) fecharJanela(janela);
            });
        });

        document.addEventListener("keydown", function (evento) {
            if (evento.key === "Escape") fecharTodas();
        });
    })();
</script>
