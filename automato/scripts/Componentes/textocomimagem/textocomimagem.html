<style>
    .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        padding: 10% 3% 6%;
        justify-content: space-between;
        box-sizing: border-box;
    }

    .container div {
        width: 50%;
        height: auto;
        gap: 10px;
        display: grid;
        min-width: 0;
    }

    .container img {
        max-width: 90%;
        height: auto;
    }

    /* Mobile: um bloco abaixo do outro */
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
            padding: 20px 4%;
            align-items: center;
            justify-content: center;
        }

        .container div {
            width: 100%;
        }

        .container img {
            width: 100%;
            max-width: 100%;
            height: auto;
        }
    }
</style>

<div class="container">
    <div class="animated backInLeft">{{TEXTOS}}</div>
    <div class="animated fadeIn">{{IMAGENS}}</div>
</div>
