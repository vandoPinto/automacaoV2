<style>
    .container {
        width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10% 3% 6%;
        box-sizing: border-box;
    }

    .container > .conteudo-item {
        flex: 1 1 calc(50% - 10px);
        width: calc(50% - 10px);
        min-width: 0;
        height: auto;
        box-sizing: border-box;
    }

    /* Quando existe somente texto (ou somente uma imagem), ocupa a tela toda. */
    .container > .conteudo-item-integral {
        flex: 1 1 100%;
        width: 100%;
    }

    .container > .conteudo-item[data-tipo="imagem"] {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container > .conteudo-item img {
        display: block;
        max-width: 100%;
        height: auto;
        object-fit: contain;
    }

    @media (max-width: 768px) {
        .container {
            flex-direction: column;
            flex-wrap: nowrap;
            padding: 20px 4%;
            align-items: stretch;
            justify-content: center;
        }

        .container > .conteudo-item,
        .container > .conteudo-item-integral {
            flex: 0 0 auto;
            width: 100%;
        }

        .container > .conteudo-item[data-tipo="imagem"] {
            justify-content: center;
        }

        .container > .conteudo-item img {
            width: 100%;
            max-width: 100%;
            height: auto;
        }
    }
</style>

<div class="container {{class}}">
    {{CONTEUDO}}
</div>
