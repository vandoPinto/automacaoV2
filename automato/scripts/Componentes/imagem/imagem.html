<style>
    .imagem-componente,
    .imagem-componente * { box-sizing: border-box; }
    .imagem-componente {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        max-width: 100%;
        max-height: 100%;
        margin: 0;
        overflow: hidden;
    }
    .imagem-componente-titulo,
    .imagem-componente-rodape {
        flex: 0 0 auto;
        width: 100%;
        margin: 0;
        font-size: 9pt;
        line-height: 1.2;
        text-align: center;
        overflow-wrap: anywhere;
    }
    .tela-container .conteudo-item .componenteImagem > .imagem-componente-titulo,
    .tela-container .conteudo-item .componenteImagem > .imagem-componente-rodape {
        margin: 0;
    }
    .imagem-componente-titulo { font-weight: 700; }
    .imagem-componente > img,
    .tela-container .conteudo-item .componenteImagem > img {
        display: block;
        flex: 0 1 auto;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        min-width: 0;
        min-height: 0;
        border-radius: 8px;
        background: none;
        box-shadow: none;
        object-fit: contain;
        object-position: center;
    }
    .tela-container .conteudo-item:has(> .componenteImagem),
    .tela-container .conteudo-item-integral:has(> .componenteImagem) {
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }
    .tela-container .conteudo-item > .componenteImagem,
    .tela-container .conteudo-item-integral > .componenteImagem {
        flex: 1 1 auto;
        min-height: 0;
    }
</style>
<div class="componenteImagem imagem-componente" role="group" aria-label="Imagem da aula">
    {{TITULO}}
    {{IMAGENS}}
    {{RODAPE}}
</div>
