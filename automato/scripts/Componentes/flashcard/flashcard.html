<style>
    /* FLASHCARD: faces independentes, sem depender de preserve-3d/backface-visibility.
       Essa abordagem evita o espelhamento observado em alguns WebViews. */

    .flashcard-componente {
        box-sizing: border-box;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 0;
    }

    .flashcard-componente,
    .flashcard-componente * {
        box-sizing: border-box;
    }


    .flashcard-componente .flashcard-lista {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 18px;
    }

    .flashcard-componente .flip-box {
        position: relative;
        flex: 0 0 190px;
        width: 190px;
        height: 280px;
        perspective: 900px;
        -webkit-perspective: 900px;
    }

    .flashcard-componente .flip-box-inner {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .flashcard-componente .flip-box-toque {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
    }

    .flashcard-componente .flip-box-front,
    .flashcard-componente .flip-box-back {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 8px;
        transition: transform .65s ease, opacity .35s ease, visibility .35s ease;
        -webkit-transition: -webkit-transform .65s ease, opacity .35s ease, visibility .35s ease;
        cursor: pointer;
    }

    /* FRENTE DO CARTÃO */
    .flashcard-componente .flip-box-front {
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #bbb;
        color: #000;
        opacity: 1;
        visibility: visible;
        transform: rotateY(0deg);
        -webkit-transform: rotateY(0deg);
        overflow: hidden;
    }

    .flashcard-componente .flip-box-front img {
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: cover;
        object-position: center;
    }

    /* FRENTE COM TEXTO: centraliza o conteúdo sem alterar as frentes com imagem. */
    .flashcard-componente .flip-box-front-texto {
        padding: 18px;
        text-align: center;
        line-height: 1.4;
        overflow-x: hidden;
        overflow-y: auto;
        overflow-wrap: anywhere;
        word-break: normal;
        -webkit-overflow-scrolling: touch;
    }

    .flashcard-componente .flip-box-front-texto p {
        width: 100%;
        height: auto;
        margin: 0 0 10px;
        text-align: center;
        line-height: 1.4;
    }

    .flashcard-componente .flip-box-front-texto p:last-child {
        margin-bottom: 0;
    }

    .flashcard-componente .flip-box-front-texto h1,
    .flashcard-componente .flip-box-front-texto h2,
    .flashcard-componente .flip-box-front-texto h3,
    .flashcard-componente .flip-box-front-texto h4,
    .flashcard-componente .flip-box-front-texto h5,
    .flashcard-componente .flip-box-front-texto h6 {
        width: 100%;
        margin: 0 0 10px;
        text-align: center;
        line-height: 1.25;
    }

    .flashcard-componente .flip-box-front-texto ul,
    .flashcard-componente .flip-box-front-texto ol {
        display: inline-block;
        max-width: 100%;
        margin: 8px auto;
        padding-left: 22px;
        text-align: left;
    }

    .flashcard-componente .flip-box-front-imagem {
        padding: 0;
    }

    .flashcard-componente .flip-box-front-imagem p {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    /* VERSO DO CARTÃO: texto sempre inicia no topo */
    .flashcard-componente .flip-box-back {
        z-index: 1;

        display: block;

        padding: 18px 14px;

        overflow-y: auto;
        overflow-x: hidden;

        overflow-wrap: anywhere;
        word-break: normal;

        background: var(--cor-principal-escura);
        color: #fff !important;
        text-align: center;

        opacity: 0;
        visibility: hidden;

        transform: rotateY(-90deg);
        -webkit-transform: rotateY(-90deg);

        -webkit-overflow-scrolling: touch;

        /* Barra de rolagem Firefox */
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, .65) transparent;

        /* Garante início da rolagem no topo */
        scroll-behavior: auto;
    }

    /* Barra de rolagem Chrome, Edge e Safari */
    .flashcard-componente .flip-box-back::-webkit-scrollbar {
        width: 6px;
    }

    .flashcard-componente .flip-box-back::-webkit-scrollbar-track {
        background: transparent;
        margin: 8px 0;
    }

    .flashcard-componente .flip-box-back::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, .65);
        border-radius: 10px;
    }

    .flashcard-componente .flip-box-back::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, .9);
    }

    /* Preserva a cor branca dos textos */
    .flashcard-componente .flip-box-back,
    .flashcard-componente .flip-box-back p,
    .flashcard-componente .flip-box-back span,
    .flashcard-componente .flip-box-back strong,
    .flashcard-componente .flip-box-back li {
        color: #fff !important;
    }

    .flashcard-componente .flip-box-back p {
        margin: 0 0 10px;
        padding: 0 4px;
        text-align: center;
        line-height: 1.5;
    }

    .flashcard-componente .flip-box-back p:last-child {
        margin-bottom: 0;
    }

    .flashcard-componente .flashcard-voltar {
        display: block;
        margin-top: 16px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, .35);
        font-size: 12px;
        opacity: .8;
    }

    /* DESKTOP: alternância das faces pelo mouse */
    @media (hover: hover) and (pointer: fine) {
        .flashcard-componente .flip-box:hover .flip-box-front {
            opacity: 0;
            visibility: hidden;
            transform: rotateY(90deg);
            -webkit-transform: rotateY(90deg);
        }

        .flashcard-componente .flip-box:hover .flip-box-back {
            z-index: 3;
            opacity: 1;
            visibility: visible;
            transform: rotateY(0deg);
            -webkit-transform: rotateY(0deg);
        }
    }

    /* CELULAR: toque alterna o checkbox */
    .flashcard-componente .flip-box-toque:checked~.flip-box-inner .flip-box-front {
        z-index: 1;
        opacity: 0;
        visibility: hidden;
        transform: rotateY(90deg);
        -webkit-transform: rotateY(90deg);
    }

    .flashcard-componente .flip-box-toque:checked~.flip-box-inner .flip-box-back {
        z-index: 3;
        opacity: 1;
        visibility: visible;
        transform: rotateY(0deg);
        -webkit-transform: rotateY(0deg);
    }

    /* RESPONSIVIDADE PARA CELULARES */
    @media (max-width: 600px) {

        .flashcard-componente .flip-box {
            flex: 0 1 calc((100% - 14px) / 2);
            width: calc((100% - 14px) / 2);
            max-width: 190px;
            height: 250px;
        }

        .flashcard-componente .flip-box-front,
        .flashcard-componente .flip-box-back {
            height: 250px;
        }
    }
</style>

<script>
    (function () {
        var componentes = document.querySelectorAll(".flashcard-componente");

        function dispararEventoAudio(nome, detalhe) {
            document.dispatchEvent(new CustomEvent(nome, {
                detail: detalhe || {}
            }));
        }

        // O ID hierárquico já vem definido na janela do verso pelo processador.
        // O Flashcard apenas consome esse identificador; nunca monta prefixos.
        function tocarAudio(verso) {
            if (!verso) return;

            var audioId = verso.getAttribute("data-audio-id");
            if (!audioId) return;

            dispararEventoAudio("stopAudio");
            dispararEventoAudio("playAudio", { comp: audioId });
        }

        componentes.forEach(function (componente) {
            var cartoes = Array.from(componente.querySelectorAll(".flip-box"))
                .filter(function (cartao) {
                    return cartao.closest(".flashcard-componente") === componente;
                });

            cartoes.forEach(function (cartao) {
                if (cartao.getAttribute("data-audio-inicializado") === "true") return;
                cartao.setAttribute("data-audio-inicializado", "true");

                var verso = cartao.querySelector(".flip-box-back");
                var controleToque = cartao.querySelector(".flip-box-toque");

                // Somente o verso possui áudio.
                if (verso) {
                    verso.addEventListener("mouseenter", function () {
                        tocarAudio(verso);
                    });
                }

                cartao.addEventListener("mouseleave", function () {
                    dispararEventoAudio("stopAudio");
                });

                // No toque, reproduz ao virar para o verso.
                // Ao retornar para a frente, apenas interrompe o áudio.
                if (controleToque) {
                    controleToque.addEventListener("change", function () {
                        if (controleToque.checked) {
                            tocarAudio(verso);
                        } else {
                            dispararEventoAudio("stopAudio");
                        }
                    });
                }
            });
        });
    })();
</script>
