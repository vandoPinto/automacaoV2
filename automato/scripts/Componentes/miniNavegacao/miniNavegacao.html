<style>
    /* Estrutura principal */
    .mini-nav-componente {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        min-width: 0;
        min-height: 0;
        padding-bottom: 16px;
        overflow: hidden;
        box-sizing: border-box;
    }

    .mini-nav-componente *,
    .mini-nav-componente *::before,
    .mini-nav-componente *::after {
        box-sizing: border-box;
    }

    .mini-nav-corpo {
        display: flex;
        flex: 1 1 auto;
        align-items: stretch;
        gap: 12px;
        width: 100%;
        min-width: 0;
        min-height: 0;
    }

    /* Setas */
    .mini-nav-seta {
        appearance: none;
        display: flex;
        flex: 0 0 38px;
        align-self: center;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 54px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: var(--cor-principal-gradiente);
        color: #fff;
        font-size: 30px;
        line-height: 1;
        cursor: pointer;
        transition: opacity .18s ease, background .18s ease;
    }

    .mini-nav-seta:hover:not(:disabled) {
        background: var(--cor-principal-hover);
    }

    .mini-nav-seta:focus-visible {
        outline: 2px solid var(--cor-principal-hover);
        outline-offset: 3px;
    }

    .mini-nav-seta:disabled {
        opacity: .35;
        cursor: default;
    }

    /* Área e painéis */
    .mini-nav-paineis {
        display: flex;
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        overflow: hidden;
    }

    .mini-nav-painel {
        display: flex;
        flex: 0 0 100%;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 18px;
        border-radius: 6px;
        background: var(--cor-principal);
        color: #fff;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-gutter: stable;
    }

    .mini-nav-painel[hidden] {
        display: none !important;
    }

    .mini-nav-painel-conteudo {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 100%;
        margin: auto 0;
        color: inherit;
        text-align: left;
        overflow-wrap: anywhere;
    }

    .mini-nav-painel-conteudo > * {
        max-width: 100%;
    }

    .mini-nav-painel-conteudo p,
    .mini-nav-painel-conteudo li {
        max-width: 100%;
        margin: .35em 0 .55em;
        line-height: 1.4;
        text-align: left;
    }

    .mini-nav-painel-conteudo p:first-child,
    .mini-nav-painel-conteudo h1:first-child,
    .mini-nav-painel-conteudo h2:first-child,
    .mini-nav-painel-conteudo h3:first-child {
        margin-top: 0;
    }

    .mini-nav-painel-conteudo img {
        display: block;
        flex: 0 1 auto;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        object-position: center;
    }

    /* Texto e imagem lado a lado no desktop */
    .mini-nav-painel-conteudo.com-imagem {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 100%;
        min-height: 0;
        overflow: hidden;
    }

    .mini-nav-painel-conteudo .mini-nav-texto-grupo {
        display: block;
        flex: 1 1 0;
        min-width: 0;
        max-width: 100%;
        text-align: left;
    }

    .mini-nav-painel-conteudo .mini-nav-texto-grupo > :first-child {
        margin-top: 0;
    }

    .mini-nav-painel-conteudo .mini-nav-texto-grupo > :last-child {
        margin-bottom: 0;
    }

    .mini-nav-painel-conteudo .mini-nav-imagem-item {
        display: block;
        flex: 0 1 45%;
        width: 45%;
        height: 100%;
        max-width: 45%;
        max-height: 100%;
        min-height: 0;
        object-fit: contain;
        object-position: center;
    }

    .mini-nav-painel-conteudo.somente-texto {
        text-align: left;
    }

    .mini-nav-painel-conteudo.somente-imagem {
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
    }

    .mini-nav-painel-conteudo.somente-imagem img {
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    /* Mobile: altura fixa, conteúdo no topo e rolagem dentro da janela */
    @media (max-width: 768px) {
        .mini-nav-componente {
            height: auto;
            max-height: none;
            padding-bottom: 14px;
            overflow: visible;
        }

        .mini-nav-corpo {
            flex: 0 0 auto;
            align-items: center;
            gap: 6px;
            min-height: 0;
        }

        .mini-nav-seta {
            flex-basis: 30px;
            width: 30px;
            height: 44px;
            font-size: 25px;
        }

        .mini-nav-paineis {
            flex: 1 1 0;
            height: var(--mini-nav-altura-painel, 360px);
            max-height: var(--mini-nav-altura-painel, 360px);
            min-height: 0;
        }

        .mini-nav-painel,
        .mini-nav-painel:has(.mini-nav-painel-conteudo.com-imagem) {
            display: block;
            height: var(--mini-nav-altura-painel, 360px) !important;
            min-height: var(--mini-nav-altura-painel, 360px) !important;
            max-height: var(--mini-nav-altura-painel, 360px) !important;
            padding: 14px;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            overflow-anchor: none;
            scroll-behavior: auto;
            -webkit-overflow-scrolling: touch;
        }

        .mini-nav-painel-conteudo,
        .mini-nav-painel-conteudo.com-imagem,
        .mini-nav-painel-conteudo.somente-texto,
        .mini-nav-painel-conteudo.somente-imagem {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            height: auto;
            min-height: 0;
            max-height: none;
            margin: 0;
            gap: 12px;
            overflow: visible;
        }

        /* Não centralizar verticalmente textos longos: isso pode cortar o início
           do conteúdo dentro de um painel com altura limitada. */
        .mini-nav-painel-conteudo.somente-texto {
            min-height: 100%;
            justify-content: flex-start;
        }

        .mini-nav-painel-conteudo.somente-texto > * {
            flex: 0 0 auto;
            margin-top: 0;
            margin-bottom: .55em;
        }

        .mini-nav-painel-conteudo .mini-nav-texto-grupo {
            display: block;
            flex: 0 0 auto;
            width: 100%;
            min-width: 0;
            min-height: 0;
            height: auto;
            max-width: 100%;
            align-self: stretch;
            color: inherit;
            text-align: left;
        }

        .mini-nav-painel-conteudo .mini-nav-texto-grupo > * {
            max-width: 100%;
        }

        .mini-nav-painel-conteudo .mini-nav-texto-grupo p {
            margin-top: 0;
            margin-bottom: .55em;
        }

        .mini-nav-painel-conteudo .mini-nav-imagem-item,
        .mini-nav-painel-conteudo.somente-imagem img {
            display: block;
            flex: 0 0 auto;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: min(260px, 38vh);
            align-self: center;
            object-fit: contain;
            object-position: center;
        }

        .mini-nav-painel-conteudo.somente-imagem {
            min-height: 100%;
            justify-content: center;
        }
    }
</style>
<div class="mini-nav-componente" id="{{ID_COMPONENTE}}" data-mini-nav>
  <div class="mini-nav-corpo">
    <button class="mini-nav-seta mini-nav-voltar" type="button" aria-label="Janela anterior" disabled>&lsaquo;</button>
    <div class="mini-nav-paineis">{{JANELAS}}</div>
    <button class="mini-nav-seta mini-nav-avancar" type="button" aria-label="Próxima janela">&rsaquo;</button>
  </div>
</div>
<script>
(() => {
 const raiz=document.getElementById("{{ID_COMPONENTE}}");
 if(!raiz || raiz.dataset.miniNavInicializado==="true") return;
 raiz.dataset.miniNavInicializado="true";
 const area=raiz.querySelector(".mini-nav-paineis");
 const paineis=Array.from(raiz.querySelectorAll(".mini-nav-painel"))
  .filter(painel=>painel.closest(".mini-nav-componente")===raiz);
 const voltar=raiz.querySelector(".mini-nav-voltar");
 const avancar=raiz.querySelector(".mini-nav-avancar");
 if(!area || !paineis.length || !voltar || !avancar) return;
 let atual=0, agendamento=0;
 // Reorganiza somente imagens diretamente pertencentes ao conteúdo do painel.
 paineis.forEach(painel=>{
  const conteudo=painel.querySelector(".mini-nav-painel-conteudo"); if(!conteudo)return;

  // Mammoth pode deixar texto simples diretamente no painel, sem envolvê-lo em <p>.
  Array.from(conteudo.childNodes).forEach(no=>{
   if(no.nodeType===Node.TEXT_NODE && no.textContent.trim()){
    const paragrafo=document.createElement("p");
    paragrafo.textContent=no.textContent.trim();
    conteudo.insertBefore(paragrafo,no);
    no.remove();
   }else if(no.nodeType===Node.TEXT_NODE){
    no.remove();
   }
  });

  const partes=[];
  Array.from(conteudo.children).forEach(filho=>{
   // O próprio filho também pode ser a raiz de um componente já renderizado.
   // querySelector() procura apenas descendentes; por isso, sem matches() para
   // a classe da própria raiz, imagens internas do Flashcard eram removidas
   // do cartão e movidas para fora, quebrando a interação de virar a face.
   const seletorComponente = "componente, flashcard, botao, hotword, abas, mininavegacao, [class*='componente']";
   const possuiComponente=filho.matches(seletorComponente) ||
    !!filho.querySelector(seletorComponente);
   // Não desmonta componentes interativos. Em blocos comuns, procura imagens
   // também dentro de DIVs e outros wrappers produzidos pelo DOCX.
   const imgs=filho.tagName==="IMG"?[filho]:
    (!possuiComponente?Array.from(filho.querySelectorAll("img")):[]);
   if(!imgs.length){partes.push({tipo:"texto",el:filho});return;}

   const texto=filho.tagName==="IMG"?null:filho.cloneNode(true);
   if(texto){
    texto.querySelectorAll("img").forEach(i=>i.remove());
    if(!texto.textContent.trim()&&!texto.querySelector("*"))texto.remove();
   }
   if(texto && texto.parentNode)partes.push({tipo:"texto",el:texto});
   imgs.forEach(img=>partes.push({tipo:"imagem",el:img}));
  });
  const temImg=partes.some(p=>p.tipo==="imagem");
  const temTexto=partes.some(p=>p.tipo==="texto"&&(p.el.textContent.trim()||p.el.querySelector("*")));
  if(!temImg){conteudo.classList.add("somente-texto");return;}
  conteudo.classList.add("com-imagem"); if(!temTexto)conteudo.classList.add("somente-imagem");
  conteudo.replaceChildren(); let grupo=null;
  partes.forEach(p=>{if(p.tipo==="texto"){if(!grupo){grupo=document.createElement("div");grupo.className="mini-nav-texto-grupo";conteudo.appendChild(grupo);}grupo.appendChild(p.el);}
   else{p.el.classList.add("mini-nav-imagem-item");conteudo.appendChild(p.el);grupo=null;}});
 });
 // O identificador hierárquico já vem gravado no painel pelo processador
 // central. A MININAVEGACAO apenas solicita a reprodução ao runtime.
 const solicitarAudioPainel=(indice)=>{
  const audioId=paineis[indice]?.getAttribute("data-audio-id");
  if(!audioId)return;
  document.dispatchEvent(new CustomEvent("stopAudio"));
  document.dispatchEvent(new CustomEvent("playAudio",{detail:{comp:audioId}}));
 };
 const ativar=(i,reproduzirAudio=false)=>{
  const anterior=atual;
  atual=Math.max(0,Math.min(paineis.length-1,i));
  paineis.forEach((p,n)=>{
   p.hidden=n!==atual;
   if(n===atual){
    // Cada janela deve abrir do início, sem herdar a posição de rolagem anterior.
    p.scrollTop=0;
    p.scrollLeft=0;
   }
  });
  voltar.disabled=atual===0;
  avancar.disabled=atual===paineis.length-1;
  dimensionar();
  // Não repete o áudio quando a navegação tenta ultrapassar os limites.
  if(reproduzirAudio && atual!==anterior) solicitarAudioPainel(atual);
  requestAnimationFrame(()=>{
   const painel=paineis[atual];
   if(painel){painel.scrollTop=0; painel.scrollLeft=0;}
  });
 };
 voltar.addEventListener("click",()=>ativar(atual-1,true));
 avancar.addEventListener("click",()=>ativar(atual+1,true));
 const medir=(painel,largura,telaPequena)=>{
  const c=painel.querySelector(".mini-nav-painel-conteudo");if(!c)return 0;
  const clone=c.cloneNode(true);
  clone.style.cssText="display:flex;position:static;width:100%;height:auto;min-height:0;max-height:none;flex:none;margin:0;overflow:visible;box-sizing:border-box";
  if(telaPequena && clone.classList.contains("com-imagem")){
   clone.style.flexDirection="column";
   clone.style.alignItems="stretch";
   clone.style.justifyContent="center";
   clone.style.gap="10px";
  }
  clone.querySelectorAll("img").forEach(img=>{
   img.style.maxWidth="100%";
   img.style.maxHeight=telaPequena?`${window.innerHeight*.38}px`:"none";
   img.style.height="auto";
   img.style.width="auto";
   img.style.objectFit="contain";
  });
  const box=document.createElement("div");box.style.cssText=`position:absolute;left:-100000px;top:0;width:${largura}px;visibility:hidden;overflow:visible;padding:14px;box-sizing:border-box`;box.appendChild(clone);document.body.appendChild(box);const h=box.scrollHeight;box.remove();return h;
 };
 function dimensionar(){
  cancelAnimationFrame(agendamento);
  agendamento=requestAnimationFrame(()=>{
   const largura=area.clientWidth||raiz.clientWidth;
   if(!largura)return;

   const alturaRaiz=raiz.clientHeight||raiz.parentElement?.clientHeight||0;
   const paddingInferior=parseFloat(getComputedStyle(raiz).paddingBottom||0);
   const alturaDisponivel=Math.max(0,alturaRaiz-paddingInferior);

   const telaPequena=largura <= 768 ||
    window.matchMedia("(max-width: 768px)").matches;
   const alturasNaturais=telaPequena
    ?[]
    :paineis.map(painel=>medir(painel,largura,false));
   const maiorConteudo=Math.max(0,...alturasNaturais);
   const margemSegurancaInferior=20;

   // No mobile, todas as janelas usam a mesma altura fixa.
   // O conteúdo excedente é rolado dentro do próprio painel.
   const alturaMobile=360;
   const alturaComum=!telaPequena&&alturaDisponivel>0
    ?Math.max(0,alturaDisponivel-margemSegurancaInferior)
    :telaPequena?alturaMobile:maiorConteudo;

   const estiloAtivo=getComputedStyle(paineis[0]);
   const paddingVertical=parseFloat(estiloAtivo.paddingTop||0)+parseFloat(estiloAtivo.paddingBottom||0);
   const alturaUtilImagem=Math.max(0,alturaComum-paddingVertical);

   area.style.height=`${alturaComum}px`;
   area.style.width="100%";
   area.style.flex="1 1 auto";
   raiz.style.setProperty("--mini-nav-altura-painel",`${alturaComum}px`);
   raiz.style.setProperty("--mini-nav-altura-imagem",`${alturaUtilImagem}px`);
   raiz.style.setProperty(
    "--mini-nav-altura-imagem-mobile",
    `${Math.min(alturaUtilImagem,Math.max(120,window.innerHeight*.38))}px`
   );

   paineis.forEach(painel=>{
    painel.style.height=`${alturaComum}px`;
    painel.style.minHeight="0";
    painel.style.maxHeight=`${alturaComum}px`;
    painel.style.overflowX="hidden";
    painel.style.overflowY="auto";
   });
   if(telaPequena){
    area.style.height=`${alturaComum}px`;
    area.style.maxHeight=`${alturaComum}px`;
   }
  });
 }
 Array.from(raiz.querySelectorAll("img"))
  .filter(img=>img.closest(".mini-nav-componente")===raiz)
  .forEach(img=>{if(!img.complete){img.addEventListener("load",dimensionar,{once:true});img.addEventListener("error",dimensionar,{once:true});}});
 if(typeof ResizeObserver!=="undefined"){const ro=new ResizeObserver(dimensionar);ro.observe(raiz);if(raiz.parentElement)ro.observe(raiz.parentElement);}else addEventListener("resize",dimensionar);
 ativar(0);dimensionar();requestAnimationFrame(()=>requestAnimationFrame(dimensionar));
 if(document.fonts?.ready)document.fonts.ready.then(dimensionar);
})();
</script>
