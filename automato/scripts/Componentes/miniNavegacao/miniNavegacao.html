<style>

    }

        background: var(--cor-principal-hover);
        border-color: var(--cor-principal-hover);
        color: #fff;

    /* A aba selecionada usa o gradiente principal do curso. */

        color: #fff;

    .mini-nav-paineis {

        width: 100%;
        min-width: 0;

    /* Em telas pequenas, a janela acompanha o conteúdo e a rolagem fica

    @media (max-width: 768px) {

</style>
<div class="mini-nav-componente" id="{{ID_COMPONENTE}}" data-mini-nav>
  <div class="mini-nav-corpo">
    <button class="mini-nav-seta mini-nav-voltar" type="button" aria-label="Janela anterior" disabled>&lsaquo;</button>
    <div class="mini-nav-paineis">{{JANELAS}}</div>
    <button class="mini-nav-seta mini-nav-avancar" type="button" aria-label="Próxima janela">&rsaquo;</button>
  </div>
</div>
<script>
(() => {
 const raiz=document.getElementById("{{ID_COMPONENTE}}");
 if(!raiz || raiz.dataset.miniNavInicializado==="true") return;
 raiz.dataset.miniNavInicializado="true";
 const area=raiz.querySelector(".mini-nav-paineis");
 const paineis=Array.from(raiz.querySelectorAll(".mini-nav-painel"));
 const voltar=raiz.querySelector(".mini-nav-voltar");
 const avancar=raiz.querySelector(".mini-nav-avancar");
 if(!area || !paineis.length || !voltar || !avancar) return;
 let atual=0, agendamento=0;
 // Reorganiza somente imagens diretamente pertencentes ao conteúdo do painel.
 paineis.forEach(painel=>{
  const conteudo=painel.querySelector(".mini-nav-painel-conteudo"); if(!conteudo)return;
  const partes=[];
  Array.from(conteudo.children).forEach(filho=>{
   const imgs=filho.tagName==="IMG"?[filho]:filho.tagName==="P"?Array.from(filho.querySelectorAll("img")):[];
   if(!imgs.length){partes.push({tipo:"texto",el:filho});return;}
   let texto=filho.tagName==="IMG"?null:filho.cloneNode(true);
   if(texto){texto.querySelectorAll("img").forEach(i=>i.remove());if(!texto.textContent.trim()&&!texto.querySelector("*"))texto=null;}
   if(texto)partes.push({tipo:"texto",el:texto});
   imgs.forEach(img=>partes.push({tipo:"imagem",el:img}));
  });
  const temImg=partes.some(p=>p.tipo==="imagem");
  const temTexto=partes.some(p=>p.tipo==="texto"&&(p.el.textContent.trim()||p.el.querySelector("*")));
  if(!temImg){conteudo.classList.add("somente-texto");return;}
  conteudo.classList.add("com-imagem"); if(!temTexto)conteudo.classList.add("somente-imagem");
  conteudo.replaceChildren(); let grupo=null;
  partes.forEach(p=>{if(p.tipo==="texto"){if(!grupo){grupo=document.createElement("div");grupo.className="mini-nav-texto-grupo";conteudo.appendChild(grupo);}grupo.appendChild(p.el);}
   else{p.el.classList.add("mini-nav-imagem-item");conteudo.appendChild(p.el);grupo=null;}});
 });
 const ativar=i=>{
  atual=Math.max(0,Math.min(paineis.length-1,i));
  paineis.forEach((p,n)=>{
   p.hidden=n!==atual;
   if(n===atual){
    // Cada janela deve abrir do início, sem herdar a posição de rolagem anterior.
    p.scrollTop=0;
    p.scrollLeft=0;
   }
  });
  voltar.disabled=atual===0;
  avancar.disabled=atual===paineis.length-1;
  dimensionar();
  requestAnimationFrame(()=>{
   const painel=paineis[atual];
   if(painel){painel.scrollTop=0; painel.scrollLeft=0;}
  });
 };
 voltar.addEventListener("click",()=>ativar(atual-1));
 avancar.addEventListener("click",()=>ativar(atual+1));
 const medir=(painel,largura,telaPequena)=>{
  const c=painel.querySelector(".mini-nav-painel-conteudo");if(!c)return 0;
  const clone=c.cloneNode(true);
  clone.style.cssText="display:flex;position:static;width:100%;height:auto;min-height:0;max-height:none;flex:none;margin:0;overflow:visible;box-sizing:border-box";
  if(telaPequena && clone.classList.contains("com-imagem")){
   clone.style.flexDirection="column";
   clone.style.alignItems="stretch";
   clone.style.justifyContent="center";
   clone.style.gap="10px";
  }
  clone.querySelectorAll("img").forEach(img=>{
   img.style.maxWidth="100%";
   img.style.maxHeight=telaPequena?`${window.innerHeight*.38}px`:"none";
   img.style.height="auto";
   img.style.width="auto";
   img.style.objectFit="contain";
  });
  const box=document.createElement("div");box.style.cssText=`position:absolute;left:-100000px;top:0;width:${largura}px;visibility:hidden;overflow:visible;padding:14px;box-sizing:border-box`;box.appendChild(clone);document.body.appendChild(box);const h=box.scrollHeight;box.remove();return h;
 };
 function dimensionar(){
  cancelAnimationFrame(agendamento);
  agendamento=requestAnimationFrame(()=>{
   const largura=area.clientWidth||raiz.clientWidth;
   if(!largura)return;

   const alturaRaiz=raiz.clientHeight||raiz.parentElement?.clientHeight||0;
   const paddingInferior=parseFloat(getComputedStyle(raiz).paddingBottom||0);
   const alturaDisponivel=Math.max(0,alturaRaiz-paddingInferior);

   const telaPequena=largura <= 768 ||
    window.matchMedia("(max-width: 768px)").matches;
   const alturasNaturais=telaPequena
    ?[]
    :paineis.map(painel=>medir(painel,largura,false));
   const maiorConteudo=Math.max(0,...alturasNaturais);
   const margemSegurancaInferior=20;

   // No mobile, todas as janelas usam a mesma altura fixa.
   // O conteúdo excedente é rolado dentro do próprio painel.
   const alturaMobile=Math.round(Math.min(360,Math.max(280,window.innerHeight*.55)));
   const alturaComum=!telaPequena&&alturaDisponivel>0
    ?Math.max(0,alturaDisponivel-margemSegurancaInferior)
    :telaPequena?alturaMobile:maiorConteudo;

   const estiloAtivo=getComputedStyle(paineis[0]);
   const paddingVertical=parseFloat(estiloAtivo.paddingTop||0)+parseFloat(estiloAtivo.paddingBottom||0);
   const alturaUtilImagem=Math.max(0,alturaComum-paddingVertical);

   area.style.height=`${alturaComum}px`;
   area.style.width="100%";
   area.style.flex="1 1 auto";
   raiz.style.setProperty("--mini-nav-altura-painel",`${alturaComum}px`);

   raiz.style.setProperty(
    "--mini-nav-altura-imagem-mobile",

   paineis.forEach(painel=>{
    painel.style.height=`${alturaComum}px`;

  });
 }
 raiz.querySelectorAll("img").forEach(img=>{if(!img.complete){img.addEventListener("load",dimensionar,{once:true});img.addEventListener("error",dimensionar,{once:true});}});
 if(typeof ResizeObserver!=="undefined"){const ro=new ResizeObserver(dimensionar);ro.observe(raiz);if(raiz.parentElement)ro.observe(raiz.parentElement);}else addEventListener("resize",dimensionar);
 ativar(0);dimensionar();requestAnimationFrame(()=>requestAnimationFrame(dimensionar));
 if(document.fonts?.ready)document.fonts.ready.then(dimensionar);
})();
