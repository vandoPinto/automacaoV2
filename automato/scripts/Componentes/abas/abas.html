<style>
    .abas-componente {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        overflow: hidden;
        box-sizing: border-box;
    }

    .abas-componente *,
    .abas-componente *::before,
    .abas-componente *::after {
        box-sizing: border-box;
    }

    .abas-navegacao {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 0 4px;
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
    }

    .abas-botao {
        appearance: none;
        flex: 0 1 auto;
        min-width: 88px;
        max-width: 100%;
        min-height: 32px;
        margin: 0;
        padding: 7px 13px;
        border: 1px solid var(--cor-principal);
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        background: var(--cor-principal);
        color: #fff;
        font: inherit;
        font-size: .86em;
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
        overflow-wrap: anywhere;
        cursor: pointer;
        transition: background-color .18s ease, border-color .18s ease;
    }

    .abas-botao:not(.ativo):hover,
    .abas-botao:not(.ativo):focus-visible {
        background: var(--cor-principal-hover);
        border-color: var(--cor-principal-hover);
        color: #fff;
    }

    /* A aba selecionada usa o gradiente principal do curso. */
    .abas-botao.ativo {
        background: var(--cor-principal-gradiente);
        border-color: var(--cor-principal-gradiente);
        color: #fff;
    }

    .abas-botao:focus-visible {
        outline: 2px solid var(--cor-principal-hover);
        outline-offset: 2px;
        position: relative;
        z-index: 1;
    }

    .abas-paineis {
        display: flex;
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        overflow: hidden;
    }

    .abas-painel {
        display: flex;
        flex: 0 0 100%;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: var(--abas-altura-painel, auto);
        max-width: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: clamp(12px, 1.5vw, 18px);
        border-radius: 0 6px 6px 6px;
        background: var(--cor-principal);
        color: #fff;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-gutter: stable;
    }

    .abas-painel[hidden] {
        display: none !important;
    }

    .abas-painel-conteudo {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 0;
        margin: auto 0;
        color: inherit;
        text-align: left;
        overflow-wrap: anywhere;
    }

    .abas-painel-conteudo > * {
        max-width: 100%;
    }

    .abas-painel-conteudo p,
    .abas-painel-conteudo li {
        max-width: 100%;
        margin-top: .35em;
        margin-bottom: .55em;
        line-height: 1.4;
        text-align: left;
    }

    .abas-painel-conteudo p:first-child,
    .abas-painel-conteudo h1:first-child,
    .abas-painel-conteudo h2:first-child,
    .abas-painel-conteudo h3:first-child {
        margin-top: 0;
    }

    .abas-painel-conteudo img {
        display: block;
        flex: 0 1 auto;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        object-position: center;
    }

    .abas-painel-conteudo.com-imagem {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 0;
    }

    .abas-painel-conteudo .abas-texto-grupo {
        flex: 1 1 0;
        min-width: 0;
        max-width: 100%;
        text-align: left;
    }

    .abas-painel-conteudo .abas-texto-grupo > :first-child {
        margin-top: 0;
    }

    .abas-painel-conteudo .abas-texto-grupo > :last-child {
        margin-bottom: 0;
    }

    .abas-painel-conteudo .abas-imagem-item {
        flex: 0 1 45%;
        width: auto;
        height: auto;
        max-width: 45%;
        max-height: var(--abas-altura-imagem, 100%);
        object-fit: contain;
        object-position: center;
    }

    .abas-painel-conteudo.somente-texto {
        text-align: left;
    }

    .abas-painel-conteudo.somente-imagem {
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-height: 0;
    }

    .abas-painel-conteudo.somente-imagem img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: var(--abas-altura-imagem, 100%);
        object-fit: contain;
    }

    @media (max-width: 768px) {
        .abas-botao {
            flex: 1 1 calc(50% - 2px);
            min-width: 0;
            min-height: 30px;
            padding: 7px 9px;
            font-size: .82em;
        }

        .abas-painel {
            padding: 12px;
        }

        .abas-painel-conteudo.com-imagem {
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: 10px;
        }

        .abas-painel-conteudo .abas-imagem-item {
            flex: 0 1 auto;
            width: auto;
            max-width: 100%;
            max-height: var(--abas-altura-imagem-mobile, 38vh);
            align-self: center;
        }
    }

    /* Ajustes de dimensionamento: janela mais compacta e afastada do rodapé. */
    .abas-componente {
        padding-bottom: 16px;
    }

    .abas-paineis {
        margin-bottom: 0;
    }

    .abas-painel {
        padding: 18px;
    }

    .abas-painel-conteudo {
        width: 100%;
        min-height: 100%;
        flex: 0 0 auto;
    }

    /* Texto curto permanece centralizado verticalmente, sem centralizar as linhas. */
    .abas-painel-conteudo.somente-texto {
        min-height: 100%;
        justify-content: center;
        text-align: left;
    }

    .abas-painel-conteudo.somente-texto > * {
        margin-top: auto;
        margin-bottom: auto;
    }

    /* Em janelas com imagem, o conteúdo ocupa apenas a área interna.
       A imagem é contida no espaço disponível e nunca cria scroll no painel. */
    .abas-painel:has(.abas-painel-conteudo.com-imagem) {
        overflow: hidden !important;
    }

    .abas-painel-conteudo.com-imagem {
        height: 100%;
        min-height: 0;
        overflow: hidden;
    }

    .abas-painel-conteudo .abas-imagem-item {
        flex: 0 1 45%;
        width: auto;
        height: auto;
        max-width: 45%;
        max-height: 100%;
        min-height: 0;
        object-fit: contain;
    }

    .abas-painel-conteudo.somente-imagem {
        height: 100%;
        min-height: 0;
        overflow: hidden;
    }

    .abas-painel-conteudo.somente-imagem img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
    }

    @media (max-width: 768px) {
        .abas-componente {
            padding-bottom: 12px;
        }

        .abas-painel {
            padding: 14px;
        }

        .abas-painel-conteudo.com-imagem {
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .abas-painel-conteudo .abas-imagem-item {
            max-width: 100%;
            max-height: 42%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    }


    /* Ocupa todo o espaço vertical realmente disponível na tela, sem altura fixa. */
    .abas-componente {
        height: 100%;
        max-height: 100%;
        padding-bottom: 20px;
    }

    .abas-paineis {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
    }

    .abas-painel {
        height: 100%;
        max-height: 100%;
        min-height: 0;
    }

    .abas-painel-conteudo.com-imagem {
        height: 100%;
        min-height: 0;
    }

    .abas-painel-conteudo .abas-imagem-item {
        flex: 0 1 45%;
        width: 45%;
        height: 100%;
        max-width: 45%;
        max-height: 100%;
        min-height: 0;
        object-fit: contain;
        object-position: center;
    }

    .abas-painel-conteudo.somente-imagem img {
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    @media (max-width: 768px) {
        .abas-componente {
            padding-bottom: 14px;
        }

        .abas-paineis {
            flex: 1 1 auto;
        }

        .abas-painel-conteudo.com-imagem {
            height: 100%;
            min-height: 0;
        }

        .abas-painel-conteudo .abas-imagem-item {
            flex: 0 1 auto;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 42%;
            object-fit: contain;
        }
    }


    /* Em telas pequenas, a janela acompanha o conteúdo e a rolagem fica
       com a área da Tela. No desktop, o componente usa a altura disponível. */
    @media (max-width: 768px) {
        .abas-componente {
            height: auto;
            max-height: none;
            overflow: visible;
        }

        .abas-paineis {
            flex: 0 0 auto;
            min-height: 0;
        }

        .abas-painel {
            max-height: none;
        }
    }

<div class="abas-componente" id="{{ID_COMPONENTE}}" data-abas-componente>
    <div class="abas-navegacao" role="tablist" aria-label="Abas de conteúdo">
        {{BOTOES}}
    </div>

    <div class="abas-paineis">
        {{JANELAS}}
    </div>
</div>

<script>
(() => {
    const raiz = document.getElementById("{{ID_COMPONENTE}}");
    if (!raiz || raiz.dataset.abasInicializado === "true") return;
    raiz.dataset.abasInicializado = "true";

    const navegacao = raiz.querySelector(".abas-navegacao");
    const areaPaineis = raiz.querySelector(".abas-paineis");
    const botoes = Array.from(raiz.querySelectorAll(".abas-botao"));
    const paineis = Array.from(raiz.querySelectorAll(".abas-painel"));

    if (!navegacao || !areaPaineis || !botoes.length || botoes.length !== paineis.length) return;

    // Reorganiza imagens e textos em colunas, preservando a ordem do DOCX.
    paineis.forEach((painel) => {
        const conteudo = painel.querySelector(".abas-painel-conteudo");
        if (!conteudo) return;

        const filhos = Array.from(conteudo.children);
        const partes = [];

        filhos.forEach((filho) => {
            // Somente imagens pertencentes a parágrafos do conteúdo da aba
            // entram no layout texto/imagem. Não percorremos DIVs de componentes
            // filhos: isso preserva imagens internas de Flashcards, Botões etc.
            const imagens = filho.tagName === "IMG"
                ? [filho]
                : filho.tagName === "P"
                    ? Array.from(filho.querySelectorAll("img"))
                    : [];

            if (!imagens.length) {
                partes.push({ tipo: "texto", elemento: filho });
                return;
            }

            let blocoTexto = filho;
            if (filho.tagName !== "IMG") {
                blocoTexto = filho.cloneNode(true);
                blocoTexto.querySelectorAll("img").forEach(img => img.remove());
                if (!blocoTexto.textContent.trim() && !blocoTexto.querySelector("*")) {
                    blocoTexto = null;
                }
            } else {
                blocoTexto = null;
            }

            if (blocoTexto) partes.push({ tipo: "texto", elemento: blocoTexto });
            imagens.forEach(imagem => partes.push({ tipo: "imagem", elemento: imagem }));
        });

        const possuiImagem = partes.some(parte => parte.tipo === "imagem");
        const possuiTexto = partes.some(parte =>
            parte.tipo === "texto" &&
            (parte.elemento.textContent.trim() || parte.elemento.querySelector("*"))
        );

        if (!possuiImagem) {
            conteudo.classList.add("somente-texto");
            return;
        }

        conteudo.classList.add("com-imagem");
        if (!possuiTexto) conteudo.classList.add("somente-imagem");
        conteudo.replaceChildren();

        let grupoTexto = null;
        partes.forEach(parte => {
            if (parte.tipo === "texto") {
                if (!grupoTexto) {
                    grupoTexto = document.createElement("div");
                    grupoTexto.className = "abas-texto-grupo";
                    conteudo.appendChild(grupoTexto);
                }
                grupoTexto.appendChild(parte.elemento);
            } else {
                const imagem = parte.elemento;
                imagem.classList.add("abas-imagem-item");
                conteudo.appendChild(imagem);
                grupoTexto = null;
            }
        });
    });

    /*
     * Calcula uma única altura para todas as janelas.
     * A referência é o conteúdo intrínseco mais alto; se ele ultrapassar
     * a altura disponível no container pai, a janela é limitada ao espaço
     * disponível e passa a apresentar rolagem vertical.
     */
    const medirAlturaNatural = (painel, largura, telaPequena = false) => {
        const estiloPainel = getComputedStyle(painel);
        const medidor = document.createElement("div");

        medidor.style.cssText = [
            "position:absolute",
            "left:-100000px",
            "top:0",
            `width:${largura}px`,
            "height:auto",
            "min-height:0",
            "max-height:none",
            "display:block",
            "visibility:hidden",
            "overflow:visible",
            "pointer-events:none",
            "box-sizing:border-box",
            `padding:${estiloPainel.paddingTop} ${estiloPainel.paddingRight} ${estiloPainel.paddingBottom} ${estiloPainel.paddingLeft}`,
            "border:0"
        ].join(";");

        const clone = painel.querySelector(".abas-painel-conteudo").cloneNode(true);
        clone.style.cssText = [
            "display:flex",
            "position:static",
            "width:100%",
            "height:auto",
            "min-height:0",
            "max-height:none",
            "flex:none",
            "margin:0",
            "overflow:visible",
            "box-sizing:border-box"
        ].join(";");

        clone.querySelectorAll("img").forEach(img => {
            img.style.maxWidth = "100%";
            img.style.maxHeight = telaPequena ? `${window.innerHeight * 0.38}px` : "none";
            img.style.height = "auto";
            img.style.width = "auto";
            img.style.objectFit = "contain";
        });

        medidor.appendChild(clone);
        document.body.appendChild(medidor);
        const altura = medidor.scrollHeight;
        medidor.remove();
        return altura;
    };

    let agendamento = 0;

    const dimensionarPaineis = () => {
        cancelAnimationFrame(agendamento);

        agendamento = requestAnimationFrame(() => {
            const largura = areaPaineis.clientWidth || raiz.clientWidth;
            if (!largura) return;

            const alturaRaiz = raiz.clientHeight || raiz.parentElement?.clientHeight || 0;
            const alturaNavegacao = navegacao.offsetHeight;
            const alturaDisponivel = Math.max(0, alturaRaiz - alturaNavegacao);

            const telaPequena = largura <= 768 ||
                window.matchMedia("(max-width: 768px)").matches;
            const alturasNaturais = telaPequena ? [] : paineis.map(painel =>
                medirAlturaNatural(painel, largura, false)
            );
            const maiorConteudo = Math.max(0, ...alturasNaturais);

            const margemSegurancaInferior = 20;
            // Altura constante no mobile, independente do conteúdo ou da aba ativa.
            const alturaMobile = Math.round(Math.min(360, Math.max(280, window.innerHeight * 0.55)));
            const alturaComum = !telaPequena && alturaDisponivel > 0
                ? Math.max(0, alturaDisponivel - margemSegurancaInferior)
                : telaPequena
                    ? alturaMobile
                    : maiorConteudo;

            const estiloAtivo = getComputedStyle(paineis[0]);
            const paddingVertical =
                parseFloat(estiloAtivo.paddingTop || 0) +
                parseFloat(estiloAtivo.paddingBottom || 0);
            const alturaUtilImagem = Math.max(0, alturaComum - paddingVertical);

            areaPaineis.style.height = `${alturaComum}px`;
            areaPaineis.style.flex = telaPequena ? "0 0 auto" : `0 0 ${alturaComum}px`;
            raiz.style.setProperty("--abas-altura-painel", `${alturaComum}px`);
            raiz.style.setProperty("--abas-altura-imagem", `${alturaUtilImagem}px`);
            raiz.style.setProperty(
                "--abas-altura-imagem-mobile",
                `${Math.min(alturaUtilImagem, Math.max(120, window.innerHeight * 0.38))}px`
            );

            paineis.forEach(painel => {
                painel.style.height = `${alturaComum}px`;
                painel.style.minHeight = "0";
                painel.style.maxHeight = `${alturaComum}px`;
                painel.style.overflowX = "hidden";
                painel.style.overflowY = telaPequena ? "auto" : (
                    painel.querySelector(".abas-painel-conteudo.com-imagem") ? "hidden" : "auto"
                );
            });
            if (telaPequena) {
                areaPaineis.style.height = `${alturaComum}px`;
                areaPaineis.style.maxHeight = `${alturaComum}px`;
            }
        });
    };

    // O app.js resolve o nome completo do MP3 a partir do sufixo do componente.
    // Não disparar na inicialização: a primeira aba já aparece por padrão.
    const sufixoAba = (indice) => {
        let numero = indice + 1;
        let letras = "";
        while (numero > 0) {
            numero--;
            letras = String.fromCharCode(97 + numero % 26) + letras;
            numero = Math.floor(numero / 26);
        }
        return letras;
    };

    const solicitarAudioAba = (indice) => {
        document.dispatchEvent(new CustomEvent("stopAudio"));
        document.dispatchEvent(new CustomEvent("playAudio", {
            detail: { comp: "abas_" + sufixoAba(indice) }
        }));
    };

    const ativar = (indice, moverFoco = false, reproduzirAudio = false) => {
        if (indice < 0 || indice >= botoes.length) return;
        botoes.forEach((botao, i) => {
            const ativo = i === indice;
            botao.classList.toggle("ativo", ativo);
            botao.setAttribute("aria-selected", String(ativo));
            botao.tabIndex = ativo ? 0 : -1;
            paineis[i].hidden = !ativo;
            paineis[i].classList.toggle("ativo", ativo);
        });

        if (moverFoco && botoes[indice]) botoes[indice].focus();
        if (reproduzirAudio) solicitarAudioAba(indice);
    };

    botoes.forEach((botao, indice) => {
        botao.addEventListener("click", () => ativar(indice, false, true));

        botao.addEventListener("keydown", evento => {
            let destino = indice;

            if (evento.key === "ArrowRight") destino = (indice + 1) % botoes.length;
            else if (evento.key === "ArrowLeft") destino = (indice - 1 + botoes.length) % botoes.length;
            else if (evento.key === "Home") destino = 0;
            else if (evento.key === "End") destino = botoes.length - 1;
            else return;

            evento.preventDefault();
            ativar(destino, true, true);
        });
    });

    // Aguarda as imagens carregarem para que sua dimensão natural entre
    // no cálculo de altura comum das janelas.
    raiz.querySelectorAll("img").forEach(imagem => {
        if (!imagem.complete) {
            imagem.addEventListener("load", dimensionarPaineis, { once: true });
            imagem.addEventListener("error", dimensionarPaineis, { once: true });
        }
    });

    ativar(0);

    if (typeof ResizeObserver !== "undefined") {
        const observador = new ResizeObserver(dimensionarPaineis);
        observador.observe(raiz);
        if (raiz.parentElement) observador.observe(raiz.parentElement);
    } else {
        window.addEventListener("resize", dimensionarPaineis);
    }

    // Executa novamente após o primeiro layout: o container pai pode só
    // adquirir sua altura definitiva depois que a Tela entrar no DOM.
    dimensionarPaineis();
    requestAnimationFrame(() => requestAnimationFrame(dimensionarPaineis));

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(dimensionarPaineis);
    }
})();
</script>
