<style>
  .tela-saindo {
    --cor-principal: #40551c;
    --cor-principal-hover: #334516;
    --cor-borda: #dfe4d8;
    --cor-fundo: #f7f9f3;
    --cor-texto: #34451e;

    width: 100%;
    min-height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 4vw, 36px);
    background: var(--cor-fundo);
    color: var(--cor-texto);
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    box-sizing: border-box;
  }

  .tela-saindo *,
  .tela-saindo *::before,
  .tela-saindo *::after {
    box-sizing: border-box;
  }

  .tela-saindo .mensagem {
    width: min(100%, 560px);
    padding: clamp(22px, 4vw, 34px);
    background: #fff;
    border: 1px solid var(--cor-borda);
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(45, 70, 28, .08);
    font-size: clamp(16px, 2vw, 20px);
    line-height: 1.55;
  }

  .tela-saindo .spinner {
    width: 38px;
    height: 38px;
    margin: 0 auto 20px;
    border: 4px solid #e3e9dc;
    border-top-color: var(--cor-principal);
    border-radius: 50%;
    animation: tela-saindo-girar .85s linear infinite;
  }

  .tela-saindo #txtSalvando,
  .tela-saindo #txtSalvo {
    margin: 0;
  }

  .tela-saindo #txtSalvando p {
    margin: 0;
  }

  .tela-saindo #txtSalvo {
    color: var(--cor-principal);
    font-weight: 600;
  }

  @keyframes tela-saindo-girar {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 600px) {
    .tela-saindo {
      min-height: 200px;
      padding: 16px;
    }

    .tela-saindo .mensagem {
      padding: 22px 18px;
      border-radius: 8px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .tela-saindo .spinner {
      animation-duration: 1.8s;
    }
  }
</style>

<section class="tela-saindo" role="status" aria-live="polite">
  <div class="mensagem">
    <div id="txtSalvando">
      <div class="spinner" aria-hidden="true"></div>
      <p>Aguarde, estamos salvando suas informações.</p>
    </div>
    <p id="txtSalvo" ng-hide="!salvoStatus">Seus dados já foram salvos. Esta janela será fechada em 5 segundos.</p>
  </div>
</section>
