<section class="menu-html">
  <ul class="lista-licoes" ng-class="{'duas-colunas': (licoesDisponiveis.length) > 4}">
    <!-- A lista contém somente lições existentes e usa o número real de cada lição. -->
    <li ng-repeat="item in licoesDisponiveis track by item.numero">
      <button type="button"
        id="{{config.siglafla}}{{ item.numero < 10 ? ('0' + item.numero) : item.numero }}"
        class="licao-menu"
        ng-click="!licaoBloqueada(item.numero) && iniciarLicao(item.numero)"
        ng-class="{
          'bloqueado': licaoBloqueada(item.numero),
          'link': !licaoBloqueada(item.numero)
        }"
        aria-label="Abrir lição {{item.numero}}: {{item.licao.label}}">
        <span class="conteudo-licao">
          <span class="etiqueta">LIÇÃO</span>
          <span class="numero">{{item.numero}}</span>
        </span>
        <span class="conteudo">
          <span class="titulo">{{item.licao.label}}</span>
        </span>
      </button>
    </li>
  </ul>
</section>
