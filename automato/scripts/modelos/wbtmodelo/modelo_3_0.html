

<section class="menu-html">
  <ul class="lista-licoes" ng-class="{'duas-colunas': (oas.length - 1) > 4}">
    <!--
      A lista é gerada a partir de oas.
      O índice 0 é ignorado porque a diretiva menu considera
      as lições de 1 até oas.length - 1.
      O título vem de licao.label.
    -->
    <li ng-repeat="(indice, licao) in oas track by $index" ng-if="indice > 0">
      <button type="button" id="{{config.siglafla}}{{ indice * 10 < 10 ? ('0' + indice) : indice }}" class="licao-menu"
        ng-click="!licaoBloqueada(indice) && iniciarLicao(indice)" ng-class="{
          'bloqueado': licaoBloqueada(indice),
          'link': !licaoBloqueada(indice)
        }" aria-label="Abrir lição {{indice}}: {{licao.label}}">
        <span class="conteudo-licao">
          <span class="etiqueta">LIÇÃO</span>
          <span class="numero">{{indice}}</span>
        </span>
        <span class="conteudo">
          <span class="titulo">{{licao.label}}</span>
        </span>
      </button>
    </li>
  </ul>
</section>
