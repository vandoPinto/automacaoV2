<style>
  /* Estrutura sem imagens: cada lição é criada pelo AngularJS. */
  .menu-html {
    box-sizing: border-box;
    position: relative;
    width: 100%;
    min-height: 100%;
    padding: 20% 3.8%;
    overflow: hidden;
    /* background: #171717; */
    color: #292929;
    font-family: Arial, sans-serif;
  }

  .lista-licoes {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.4vw, 20px);
    width: 100%;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .licao-menu {
    box-sizing: border-box;
    position: relative;
    display: flex;
    align-items: center;
    gap: clamp(12px, 2vw, 28px);
    width: 100%;
    min-height: clamp(72px, 8vw, 104px);
    padding: 12px clamp(16px, 2.5vw, 36px);
    border: 0;
    border-left: 7px solid #d6a900;
    border-radius: 3px;
    background: linear-gradient(110deg, #f5d54e 0%, #e9b916 55%, #d6a900 100%);
    box-shadow: 0 3px 8px rgb(0 0 0 / 30%);
    color: #292929;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: transform .18s ease, filter .18s ease, opacity .18s ease;
  }

  .licao-menu:hover:not(.bloqueado) {
    filter: brightness(1.06);
    transform: translateX(4px);
  }

  .licao-menu .numero {
    flex: 0 0 auto;
    min-width: 1.1em;
    font-size: clamp(28px, 4.2vw, 52px);
    line-height: 1;
    font-weight: 800;
    text-align: center;
  }

  .licao-menu .conteudo {
    min-width: 0;
  }

  .licao-menu .etiqueta {
    display: block;
    margin-bottom: 4px;
    color: #5d4a00;
    font-size: clamp(10px, 1.1vw, 14px);
    font-weight: 800;
    letter-spacing: .12em;
  }

  .licao-menu .titulo {
    display: block;
    overflow-wrap: anywhere;
    font-size: clamp(13px, 1.45vw, 20px);
    line-height: 1.25;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .licao-menu.bloqueado {
    opacity: .42;
    cursor: not-allowed;
    filter: grayscale(.5);
  }

  .licao-menu:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  @media (max-width: 600px) {
    .menu-html {
      padding: 16px 12px;
    }

    .licao-menu {
      gap: 12px;
      padding: 12px;
      border-left-width: 5px;
    }

    .licao-menu .titulo {
      letter-spacing: 0;
    }
  }
</style>

<main class="menu-html">
  <ul class="lista-licoes">
    <!--
        A lista é gerada a partir de oas. O índice 0 é ignorado porque
        a diretiva menu existente considera as lições de 1 até oas.length - 1.
        O título vem de licao.label, conforme o uso existente de oas[indice].label.
        A diretiva menu será adaptada para aplicar as regras de bloqueio e demo.
      -->
    <li ng-repeat="(indice, licao) in oas track by $index" ng-if="indice > 0">
      <button type="button" id="{{config.siglafla}}{{ indice < 10 ? ('0' + indice) : indice }}" class="licao-menu"
        ng-click="!licaoBloqueada(indice) && iniciarLicao(indice)"
        ng-class="{'bloqueado': licaoBloqueada(indice),'link': !licaoBloqueada(indice)}"
        aria-label="Abrir lição {{indice}}: {{licao.label}}">
        <span class="numero">{{indice}}</span>
        <span class="conteudo">
          <span class="etiqueta">LIÇÃO</span>
          <span class="titulo">{{licao.label}}</span>
        </span>
      </button>
    </li>
  </ul>
</main>
