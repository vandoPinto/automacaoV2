<div class="tela-topicos-html">
  <style>
    .tela-topicos-html {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      height: 100%;
      min-height: 400px;
      overflow: hidden;
      box-sizing: border-box;
      padding: 24px 16px;
      font-family: Arial, Helvetica, sans-serif;
      color: #263126;
      background: #f5f7f3;
    }

    .tela-topicos-html * {
      box-sizing: border-box;
    }

    .tela-topicos-cabecalho {
      flex: 0 0 auto;
      width: min(82%, 1000px);
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 14px 26px;
      color: #ffffff;
      background: #40551c;
      border-radius: 8px 8px 0 0;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1.1;
      box-shadow: 0 2px 5px rgba(25, 40, 15, .12);
    }

    .tela-topicos-conteudo {
      flex: 0 1 auto;
      width: min(82%, 1000px);
      max-height: min(50vh, 680px);
      min-height: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      margin: 0 auto;
      padding: 22px 26px;
      background: #ffffff;
      border: 1px solid #e0e6da;
      border-top: 0;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 12px rgba(30, 45, 20, .08);
      scrollbar-gutter: stable;
    }

    .tela-topicos-lista {
      margin: 0;
      padding: 0;
      list-style: none;
      line-height: 1.6;
    }

    .tela-topicos-licao {
      margin: 0 0 10px;
    }

    .tela-topicos-titulo-licao,
    .tela-topicos-item {
      display: block;
      width: 100%;
      /* padding: 9px 12px; */
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      line-height: inherit;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }

    .tela-topicos-titulo-licao {
      font-weight: 700;
      color: #40551c;
    }

    .tela-topicos-item {
      padding-left: 34px;
      font-size: .97em;
    }

    .tela-topicos-html .bloqueado {
      opacity: .45;
      cursor: not-allowed !important;
      pointer-events: none;
    }

    .tela-topicos-html .link {
      cursor: pointer;
    }

    .tela-topicos-html button:hover {
      color: #334516;
      background: #f1f5eb;
    }

    .tela-topicos-html button:focus-visible {
      outline: 2px solid #8ba66a;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      .tela-topicos-html {
        min-height: 360px;
        padding: 16px 10px;
      }

      .tela-topicos-cabecalho,
      .tela-topicos-conteudo {
        width: 96%;
      }

      .tela-topicos-cabecalho {
        min-height: 52px;
        padding: 12px 16px;
        font-size: 25px;
      }

      .tela-topicos-conteudo {
        max-height: 72%;
        min-height: 180px;
        padding: 14px 12px;
      }

      .tela-topicos-titulo-licao,
      .tela-topicos-item {
        padding-top: 7px;
        padding-bottom: 7px;
      }

      .tela-topicos-item {
        padding-left: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .tela-topicos-titulo-licao,
      .tela-topicos-item {
        transition: none;
      }
    }
  </style>

  <div class="tela-topicos-cabecalho">TÓPICOS</div>

  <div class="tela-topicos-conteudo">
    <ol class="tela-topicos-lista">
      <li class="tela-topicos-licao" ng-repeat="licao in oas track by $index" ng-if="$index !== 0"
        ng-class="classeLicaoTopicos($index)">
        <button type="button" class="tela-topicos-titulo-licao"
          ng-click="classeLicaoTopicos($index) !== 'bloqueado' && iniciarLicao($index)">
          {{$index}} &mdash; {{licao.label}}
        </button>
        <ol class="tela-topicos-lista">
          <li ng-repeat="topico in licao.arquivos track by $index" ng-class="classeTopico($parent.$index, $index)">
            <button type="button" class="tela-topicos-item" id="licao{{$parent.$index}}_topico{{$index + 1}}"
              ng-click="classeTopico($parent.$index, $index) !== 'bloqueado' && iniciarLicao($parent.$index, $index)">
              {{$parent.$index}}.{{$index + 1}} &mdash; {{topico.nome}}
            </button>
          </li>
        </ol>
      </li>
    </ol>
  </div>
</div>
