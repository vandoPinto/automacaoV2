<div class="tela-topicos-html">
  <div class="tela-topicos-cabecalho">TÓPICOS</div>

  <div class="tela-topicos-conteudo">
    <ol class="tela-topicos-lista">
      <li class="tela-topicos-licao"
        ng-repeat="item in licoesDisponiveis track by item.numero"
        ng-class="classeLicaoTopicos(item.numero)">
        <button type="button" class="tela-topicos-titulo-licao"
          ng-click="classeLicaoTopicos(item.numero) !== 'bloqueado' && iniciarLicao(item.numero)">
          {{item.numero}} &mdash; {{item.licao.label}}
        </button>
        <ol class="tela-topicos-lista">
          <li ng-repeat="topico in item.licao.arquivos track by $index"
            ng-class="classeTopico(item.numero, $index)">
            <button type="button" class="tela-topicos-item"
              id="licao{{item.numero}}_topico{{$index + 1}}"
              ng-click="classeTopico(item.numero, $index) !== 'bloqueado' && iniciarLicao(item.numero, $index)">
              {{item.numero}}.{{$index + 1}} &mdash; {{topico.nome}}
            </button>
          </li>
        </ol>
      </li>
    </ol>
  </div>
</div>
