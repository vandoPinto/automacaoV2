<style>
  .bem-vindo-html {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    min-height: 520px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: clamp(20px, 4vw, 56px);
    background: #f4f6f1;
    color: #252b22;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .bem-vindo-html *,
  .bem-vindo-html *::before,
  .bem-vindo-html *::after {
    box-sizing: border-box;
  }

  .bem-vindo-html .decor {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .bem-vindo-html .decor-one {
    width: 340px;
    height: 340px;
    left: -100px;
    bottom: -115px;
    background: #40551c;
    opacity: .95;
  }

  .bem-vindo-html .decor-two {
    width: 190px;
    height: 190px;
    left: 95px;
    top: 45px;
    border: 18px solid #d9b544;
    opacity: .85;
  }

  .bem-vindo-html .panel {
    position: relative;
    z-index: 1;
    width: min(570px, 100%);
    padding: clamp(24px, 4vw, 44px);
    background: #fff;
    border: 1px solid #e0e5da;
    border-radius: 10px;
    box-shadow: 0 8px 28px rgb(32 42 24 / 10%);
  }

  .bem-vindo-html .eyebrow {
    color: #40551c;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
  }

  .bem-vindo-html h1 {
    margin: 10px 0 20px;
    color: #252b22;
    font-size: clamp(28px, 3.5vw, 42px);
    font-weight: 700;
    line-height: 1.15;
  }

  .bem-vindo-html p {
    margin: 0 0 18px;
    font-size: 16px;
    line-height: 1.6;
  }

  .bem-vindo-html .info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 22px 0;
  }

  .bem-vindo-html .info-item {
    min-width: 0;
    padding: 14px;
    background: #f6f7f3;
    border: 1px solid #e4e8df;
    border-radius: 6px;
  }

  .bem-vindo-html .info-label {
    display: block;
    margin-bottom: 6px;
    color: #687060;
    font-size: 12px;
    font-weight: 600;
  }

  .bem-vindo-html .info-value {
    display: block;
    color: #252b22;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .bem-vindo-html .question {
    margin: 22px 0 16px !important;
    font-weight: 600;
  }

  .bem-vindo-html .actions {
    display: flex;
    gap: 10px;
  }

  .bem-vindo-html button {
    min-width: 112px;
    padding: 11px 24px;
    border: 1px solid transparent;
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .3px;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }

  .bem-vindo-html .yes {
    background: #40551c;
    color: #fff;
  }

  .bem-vindo-html .yes:hover {
    background: #334516;
  }

  .bem-vindo-html .no {
    background: #fff;
    border-color: #cfd7c5;
    color: #40551c;
  }

  .bem-vindo-html .no:hover {
    background: #f4f6f0;
    border-color: #aebba0;
  }

  .bem-vindo-html button:focus-visible {
    outline: 3px solid #a9bd8c;
    outline-offset: 3px;
  }

  @media (max-width: 600px) {
    .bem-vindo-html {
      min-height: 100%;
      padding: 16px;
    }

    .bem-vindo-html .decor-one {
      width: 220px;
      height: 220px;
      left: -100px;
      bottom: -60px;
    }

    .bem-vindo-html .decor-two {
      width: 130px;
      height: 130px;
      left: 10px;
      top: 10px;
      border-width: 12px;
    }

    .bem-vindo-html .info {
      grid-template-columns: 1fr;
    }

    .bem-vindo-html .panel {
      padding: 22px;
    }

    .bem-vindo-html .actions button {
      flex: 1;
      min-width: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .bem-vindo-html button {
      transition: none;
    }
  }
</style>
<section class="bem-vindo-html" aria-label="Bem-vindo ao curso">
  <div class="decor decor-one"></div>
  <div class="decor decor-two"></div>
  <div class="panel">
    <div class="eyebrow">Bem-vindo</div>
    <h1>Vamos continuar?</h1>
    <p>Seja bem-vindo ao curso de <strong>{{config.label}}</strong>.</p>
    <div class="info">
      <div class="info-item"><span class="info-label">Último acesso</span><span
          class="info-value">{{bemVindoUltimoAcesso}}</span></div>
      <div class="info-item"><span class="info-label">Duração</span><span class="info-value">{{bemVindoDuracao}}</span>
      </div>
    </div>
    <p class="question">Deseja continuar do ponto onde parou?</p>
    <div class="actions">
      <button type="button" class="yes" ng-click="bemVindoSim()">SIM</button>
      <button type="button" class="no" ng-click="bemVindoNao()">NÃO</button>
    </div>
  </div>
</section>
