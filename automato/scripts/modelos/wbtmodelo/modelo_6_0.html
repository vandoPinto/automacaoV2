<div class="chat-overlay" role="dialog" aria-modal="true" aria-labelledby="chatTitulo">
  <style>
    #janelaChat.chat-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2147483000;
      display: none;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 18px;
      background: rgba(24, 38, 22, .48);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    #janelaChat .chat-painel {
      position: absolute;
      top: 35%;
      left: 10%;
      width: min(760px, 94%);
      height: min(420px, 50%);
      min-height: 300px;
      box-sizing: border-box;
      padding: 30px 34px 28px;
      background: #f7f9f3;
      border: 5px solid #ffffff;
      box-shadow: 0 16px 42px rgba(25, 40, 20, .28);
      display: flex;
      flex-direction: column;
      border-radius: 14px;
    }

    #janelaChat .chat-fechar {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      color: #40551c;
      font-size: 36px;
      line-height: 30px;
      cursor: pointer;
    }

    #janelaChat .chat-titulo {
      color: #304318;
      font-size: 18px;
      font-weight: 400;
      margin: 0 0 14px;
    }

    #janelaChat #mensagem {
      display: block;
      width: 100%;
      flex: 1;
      min-height: 150px;
      resize: none;
      box-sizing: border-box;
      border: 1px solid #cbd4bf;
      background: #fff;
      color: #26351b;
      font: 18px/1.45 "Trebuchet MS", Arial, sans-serif;
      padding: 12px;
      outline-color: #607d35;
      text-align: left;
    }

    #janelaChat .chat-acoes {
      display: flex;
      justify-content: center;
      padding-top: 22px;
    }

    #janelaChat #enviar {
      min-width: 107px;
      height: 38px;
      padding: 0 20px;
      border: 0;
      border-radius: 2px;
      background: #40551c;
      color: #fff;
      font: bold 20px "Trebuchet MS", Arial, sans-serif;
      cursor: pointer;
    }

    #janelaChat #enviar:hover {
      background: #304318;
    }

    #janelaChat button:focus-visible {
      outline: 3px solid #718b45;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      #janelaChat.chat-overlay {
        padding: 10px;
      }

      #janelaChat .chat-painel {
        width: 100%;
        height: min(490px, 94%);
        padding: 26px 16px 20px;
        border-width: 4px;
        border-radius: 12px;
      }

      #janelaChat .chat-titulo {
        padding-right: 34px;
        font-size: 16px;
      }

      #janelaChat #mensagem {
        font-size: 16px;
      }
    }
  </style>
  <section class="chat-painel">
    <button type="button" id="fechar" class="chat-fechar" aria-label="Fechar chat" title="Fechar">×</button>
    <p id="chatTitulo" class="chat-titulo">Digite sua dúvida aqui:</p>
    <textarea id="mensagem" maxlength="500" aria-label="Digite sua dúvida" spellcheck="true"></textarea>
    <div class="chat-acoes">
      <button type="button" id="enviar">Enviar</button>
    </div>
  </section>
</div>
