<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  .loading-screen {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f1e8;
  }

  .loading-message {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px;
    color: #333;
    font-size: clamp(14px, 1.8vw, 18px);
    line-height: 1.4;
    text-align: center;
  }

  .loading-spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #d9ddcf;
    border-top-color: #40551c;
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
  }

  @keyframes girar {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-spinner {
      animation: none;
      border-top-color: #40551c;
    }
  }
</style>

<main class="loading-screen" role="status" aria-live="polite">
  <div class="loading-message"><span class="loading-spinner" aria-hidden="true"></span><span>Carregando informações do
      aluno</span></div>
</main>
