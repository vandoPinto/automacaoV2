
<section class="bem-vindo-html" aria-label="Bem-vindo ao curso">
  <div class="decor decor-one"></div>
  <div class="decor decor-two"></div>
  <div class="panel">
    <div class="eyebrow">Bem-vindo</div>
    <h1>Vamos continuar?</h1>
    <p>Seja bem-vindo ao curso de <strong>{{config.label}}</strong>.</p>
    <div class="info">
      <div class="info-item"><span class="info-label">Último acesso</span><span
          class="info-value">{{bemVindoUltimoAcesso}}</span></div>
      <div class="info-item"><span class="info-label">Duração</span><span class="info-value">{{bemVindoDuracao}}</span>
      </div>
    </div>
    <p class="question">Deseja continuar do ponto onde parou?</p>
    <div class="actions">
      <button type="button" class="yes" ng-click="bemVindoSim()">SIM</button>
      <button type="button" class="no" ng-click="bemVindoNao()">NÃO</button>
    </div>
  </div>
</section>
