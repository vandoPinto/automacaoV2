<style>
    .barra-navegacao-html {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 1016px;
        height: 76px;
        margin: 0 auto;
        overflow: hidden;
        box-sizing: border-box;
        background: linear-gradient(135deg, #f7f9f3 0%, #ffffff 100%);
        border: 1px solid #d9e2ce;
        border-top: 0;
        border-radius: 0 0 8px 8px;
        box-shadow: 0 2px 8px rgba(38, 55, 22, 0.10);
        font-family: Arial, Helvetica, sans-serif;
    }

    .barra-navegacao-html *,
    .barra-navegacao-html *::before,
    .barra-navegacao-html *::after {
        box-sizing: border-box;
    }

    .barra-navegacao-html .nav-botao {
        position: absolute;
        top: 0;
        height: 75px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-right: 1px solid rgba(255, 255, 255, .35);
        border-radius: 0;
        cursor: pointer;
        color: #fff;
        background: #40551c;
        transition: background-color .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .barra-navegacao-html .nav-botao:hover:not(:disabled) {
        background: #58752a;
    }

    .barra-navegacao-html .nav-botao:active:not(:disabled) {
        background: #304216;
    }

    .barra-navegacao-html .nav-botao:focus-visible {
        outline: 2px solid #d5e5b8;
        outline-offset: -4px;
        z-index: 2;
    }

    .barra-navegacao-html .nav-menu {
        left: 6px;
        width: 66px;
        border-radius: 7px;
        border: 1px solid #d5dfc8;
    }

    .nav-icone-menu {
        font-size: 31px;
        line-height: 1;
    }

    .barra-navegacao-html .nav-chat {
        left: 78px;
        width: 60px;
        background: #55712b;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, .3);
    }

    .nav-icone-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border: 2px solid #fff;
        border-radius: 50%;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
    }

    .barra-navegacao-html .nav-som {
        left: 150px;
        width: 60px;
        background: #55712b;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, .3);
    }

    .nav-icone-som {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 25px;
        line-height: 1;
        filter: grayscale(1) brightness(0) invert(1);
    }

    .nav-progresso {
        position: absolute;
        left: 222px;
        right: 144px;
        top: 20px;
        width: auto;
        max-width: 600px;
        height: 38px;
        margin: 0 auto;
        transform: none;
        color: #34451e;
        font-family: "Trebuchet MS", Arial, sans-serif;
        font-size: 13px;
    }

    .nav-progresso-textos {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 6px;
        white-space: nowrap;
        font-weight: 700;
    }

    .nav-progresso-trilho {
        width: 100%;
        height: 7px;
        overflow: hidden;
        background: #d5dfca;
        border-radius: 99px;
        box-shadow: inset 0 1px 2px rgba(30, 45, 18, .12);
    }

    .nav-progresso-atual {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #779b3e, #40551c);
        border-radius: 99px;
        transition: width .3s ease;
    }

    .barra-navegacao-html .nav-voltar,
    .barra-navegacao-html .nav-avancar {
        width: 60px;
        background: #40551c;
        border: 1px solid rgba(255, 255, 255, .25);
        border-radius: 7px;
    }

    .barra-navegacao-html .nav-voltar {
        right: 72px;
    }

    .barra-navegacao-html .nav-avancar {
        right: 6px;
        background: #55712b;
    }

    .nav-seta {
        font-size: 23px;
        line-height: 1;
    }

    .barra-navegacao-html .nav-botao.bloqBtn,
    .barra-navegacao-html .nav-botao:disabled {
        opacity: .38;
        cursor: not-allowed;
        filter: grayscale(.25);
    }

    @media (max-width: 768px) {
        .barra-navegacao-html {
            height: 62px;
            border-radius: 0 0 6px 6px;
        }

        .barra-navegacao-html .nav-botao {
            top: 0;
            height: 61px;
        }

        .barra-navegacao-html .nav-menu {
            left: 4px;
            width: 42px;
        }

        .nav-icone-menu {
            font-size: 21px;
        }

        .barra-navegacao-html .nav-chat {
            left: 52px;
            width: 40px;
        }

        .nav-icone-chat {
            width: 24px;
            height: 24px;
            font-size: 16px;
        }

        .barra-navegacao-html .nav-som {
            left: 96px;
            width: 40px;
        }

        .nav-icone-som {
            font-size: 22px;
        }

        .nav-progresso {
            left: 144px;
            right: 104px;
            top: 15px;
            height: 34px;
            font-size: 10px;
        }

        .barra-navegacao-html .nav-voltar {
            right: 52px;
            width: 40px;
        }

        .barra-navegacao-html .nav-avancar {
            right: 4px;
            width: 40px;
        }

        .nav-seta {
            font-size: 15px;
        }
    }

    @media (max-width: 420px) {
        .barra-navegacao-html .nav-chat {
            display: none;
        }

        .barra-navegacao-html .nav-som {
            left: 52px;
        }

        .nav-progresso {
            left: 100px;
            right: 92px;
            top: 16px;
        }

        .barra-navegacao-html .nav-voltar {
            right: 46px;
            width: 36px;
        }

        .barra-navegacao-html .nav-avancar {
            right: 4px;
            width: 36px;
        }
    }

    @media (prefers-reduced-motion: reduce) {

        .barra-navegacao-html *,
        .barra-navegacao-html *::before,
        .barra-navegacao-html *::after {
            transition: none !important;
        }
    }
</style>

<div class="barra-navegacao-html">

    <!-- Menu -->
    <button id="btnMenu" type="button" class="nav-botao nav-menu linkNav" ng-click="menu()" aria-label="Abrir menu"
        title="Menu">

        <span class="nav-icone-menu">&#9776;</span>
    </button>

    <!-- Chat -->
    <button id="btnChat" type="button" class="nav-botao nav-chat" aria-label="Abrir chat" title="Chat">

        <span class="nav-icone-chat">?</span>
    </button>

    <!-- Som ativo -->
    <button id="btnSomAtivo" type="button" class="nav-botao nav-som linkNav" ng-click="somAtivo()"
        ng-show="somAtivoStatus" aria-label="Desativar som" title="Desativar som">

        <span class="nav-icone-som">&#128264;</span>
    </button>

    <!-- Som inativo -->
    <button id="btnSomInativo" type="button" class="nav-botao nav-som linkNav" ng-click="somAtivo()"
        ng-hide="somAtivoStatus" aria-label="Ativar som" title="Ativar som">

        <span class="nav-icone-som">&#128266;</span>
    </button>

    <!-- Progresso -->
    <div class="nav-progresso">

        <div class="nav-progresso-textos">
            <span id="progTela" ng-bind="'Tela ' + telaAtual + '/' + numeroTelasTopico">
            </span>

            <span id="progPorcentagem" ng-bind="(porcentagem || 0) + '%'">
            </span>
        </div>

        <div class="nav-progresso-trilho">
            <div id="progBar" class="nav-progresso-atual" ng-style="{ 'width': (porcentagem || 0) + '%' }">
            </div>
        </div>

    </div>

    <!-- Voltar -->
    <button id="btnVoltar" type="button" class="nav-botao nav-voltar" ng-click="$root.podeVoltar && voltar()" ng-class="{
        linkNav: $root.podeVoltar,
        bloqBtn: !$root.podeVoltar
    }" ng-disabled="!$root.podeVoltar" aria-label="Voltar">

        <span class="nav-seta">&#9664;</span>
    </button>

    <button id="btnAvancar" type="button" class="nav-botao nav-avancar" ng-click="$root.podeAvancar && avancar()"
        ng-class="{
        linkNav: $root.podeAvancar,
        bloqBtn: !$root.podeAvancar
    }" ng-disabled="!$root.podeAvancar" aria-label="Avançar">

        <span class="nav-seta">&#9654;</span>
    </button>

</div>
