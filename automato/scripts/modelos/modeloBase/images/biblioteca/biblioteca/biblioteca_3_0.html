<style>
  .barra-topicos {
    --cor-principal: #40551c;
    --cor-borda: #dfe4d8;

    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: .5rem;
    width: 100%;
    padding: .75rem 1rem;
    background: #fff;
    border: 1px solid var(--cor-borda);
    border-radius: .5rem;
    box-sizing: border-box;

    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .barra-topicos *,
  .barra-topicos *::before,
  .barra-topicos *::after {
    box-sizing: border-box;
  }

  .barra-topicos__acoes {
    display: flex;
    align-items: center;
    gap: .5rem;
    width: 100%;
  }

  .barra-topicos__botao {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    min-height: 40px;
    padding: .55rem .85rem;

    border: 1px solid var(--cor-borda);
    border-radius: .375rem;
    background: #fff;
    color: var(--cor-principal);

    font-family: Arial, Helvetica, sans-serif;
    font-size: .875rem;
    font-weight: 600;
    letter-spacing: .3px;
    white-space: nowrap;

    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }

  .barra-topicos__botao:hover {
    background: #f4f6f0;
    border-color: #b9c4aa;
  }

  .barra-topicos__botao:focus-visible {
    outline: 3px solid #a9bd8c;
    outline-offset: 2px;
  }

  .barra-topicos__botao--principal {
    margin-left: auto;
    background: var(--cor-principal);
    border-color: var(--cor-principal);
    color: #fff;
  }

  .barra-topicos__botao--principal:hover {
    background: #334516;
    border-color: #334516;
    color: #fff;
  }

  @media (max-width: 600px) {
    .barra-topicos {
      padding: .5rem;
    }

    .barra-topicos__acoes {
      justify-content: space-between;
    }

    .barra-topicos__botao {
      min-height: 38px;
      padding: .5rem .65rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .barra-topicos__botao {
      transition: none;
    }
  }
</style>

<section class="barra-topicos" aria-label="Navegação dos tópicos">
  <nav class="barra-topicos__acoes" aria-label="Ações de navegação">

    <button type="button" class="barra-topicos__botao" ng-click="topicos()" aria-label="Voltar à lista de tópicos">
      <span aria-hidden="true">☰</span>
      Tópicos
    </button>

    <button type="button" class="barra-topicos__botao barra-topicos__botao--principal" ng-click="sair()"
      aria-label="Sair do curso">
      Sair
      <span aria-hidden="true">→</span>
    </button>

  </nav>
</section>
