<style>
  .barra-navegacao-topicos {
    --cor-principal: #40551c;
    --cor-principal-hover: #334516;
    --cor-borda: #dfe4d8;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    width: 100%;
    max-width: 1016px;
    min-height: 60px;
    margin: 0 auto;
    padding: .65rem 1rem;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid var(--cor-borda);
    border-radius: .5rem;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .barra-navegacao-topicos *,
  .barra-navegacao-topicos *::before,
  .barra-navegacao-topicos *::after {
    box-sizing: border-box;
  }

  .barra-navegacao-topicos__botao {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    min-width: 44px;
    min-height: 40px;
    padding: .55rem .85rem;
    border: 1px solid var(--cor-borda);
    border-radius: .375rem;
    background: #fff;
    color: var(--cor-principal);
    font: 600 .875rem/1 Arial, Helvetica, sans-serif;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }

  .barra-navegacao-topicos__botao:hover {
    background: #f4f6f0;
    border-color: #b9c4aa;
  }

  .barra-navegacao-topicos__botao:focus-visible {
    outline: 3px solid #a9bd8c;
    outline-offset: 2px;
  }

  .barra-navegacao-topicos__botao--principal {
    margin-left: auto;
    background: var(--cor-principal);
    border-color: var(--cor-principal);
    color: #fff;
  }

  .barra-navegacao-topicos__botao--principal:hover {
    background: var(--cor-principal-hover);
    border-color: var(--cor-principal-hover);
    color: #fff;
  }

  .barra-navegacao-topicos__icone-casa {
    position: relative;
    display: inline-block;
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
  }

  .barra-navegacao-topicos__telhado {
    position: absolute;
    top: 2px;
    left: 4px;
    width: 14px;
    height: 14px;
    border-top: 2px solid currentColor;
    border-left: 2px solid currentColor;
    transform: rotate(45deg);
  }

  .barra-navegacao-topicos__casa {
    position: absolute;
    left: 4px;
    bottom: 1px;
    width: 14px;
    height: 12px;
    background: #fff;
    border: 2px solid currentColor;
    border-top: 0;
  }

  .barra-navegacao-topicos__porta {
    position: absolute;
    left: 4px;
    bottom: 0;
    width: 4px;
    height: 7px;
    border: 1px solid currentColor;
    border-bottom: 0;
  }

  @media (max-width: 600px) {
    .barra-navegacao-topicos {
      min-height: 54px;
      padding: .5rem;
      border-radius: .4rem;
    }

    .barra-navegacao-topicos__botao {
      min-height: 38px;
      padding: .5rem .65rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .barra-navegacao-topicos__botao {
      transition: none;
    }
  }
</style>

<nav class="barra-navegacao-topicos" aria-label="Navegação dos tópicos">
  <button type="button" class="barra-navegacao-topicos__botao" ng-click="menu()"
    aria-label="Início" title="Início">
    <span class="barra-navegacao-topicos__icone-casa" aria-hidden="true">
      <span class="barra-navegacao-topicos__telhado"></span>
      <span class="barra-navegacao-topicos__casa">
        <span class="barra-navegacao-topicos__porta"></span>
      </span>
    </span>
    Início
  </button>

  <button type="button" class="barra-navegacao-topicos__botao barra-navegacao-topicos__botao--principal"
    ng-click="sair()" aria-label="Sair do curso">
    Sair <span aria-hidden="true">→</span>
  </button>
</nav>
