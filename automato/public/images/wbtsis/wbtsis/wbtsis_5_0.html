<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #f4f6fb;
    color: #26334a;
  }

  .tela-saindo {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }

  .mensagem {
    font-size: clamp(17px, 2.4vw, 21px);
    line-height: 1.5;
    max-width: 560px;
    margin: 0 auto;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border: 4px solid #d9e1ef;
    border-top-color: #1a57a7;
    border-radius: 50%;
    animation: girar .9s linear infinite;
    margin: 0 auto 22px;
  }

  #txtSalvando,
  #txtSalvo {
    margin: 0;
  }

  #txtSalvo {
    margin-top: 0;
  }

  @keyframes girar {
    to {
      transform: rotate(360deg);
    }
  }
</style>
<section class="tela-saindo">
  <div class="mensagem">
    <div id="txtSalvando">
      <div class="spinner" aria-hidden="true"></div>
      <p>Aguarde, estamos salvando suas informações.</p>
    </div>
    <p id="txtSalvo" ng-hide="!salvoStatus">Seus dados já foram salvos. Esta janela será fechada em 5 segundos.</p>
  </div>
</section>
