<div class="tela-topicos-html">
  <style>
    .tela-topicos-html {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 400px;
      overflow: auto;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      color: #292929;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255, 255, 255, .98) 0%, rgba(242, 242, 242, .96) 48%, rgba(204, 204, 204, .98) 100%),
        linear-gradient(135deg, #f4f4f4, #c7c7c7);
      padding: 0;
    }

    .tela-topicos-html * {
      box-sizing: border-box;
    }

    .tela-topicos-cabecalho {
      position: relative;
      width: 59.87%;
      min-height: 46px;
      margin: 25% auto 0;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      padding: 5px 18px;
      color: #fff;
      background: linear-gradient(to bottom, #f7c500 0%, #e7ae00 100%);
      font-family: Folio_BdCn_BT_Bold, Arial, sans-serif;
      font-size: clamp(20px, 2.95vw, 30px);
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1.1;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .3);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
    }

    .tela-topicos-conteudo {
      width: 59.87%;
      max-height: 52%;
      overflow-y: auto;
      margin: -5px auto 0;
      padding: 14px 18px 18px;
      background: rgba(255, 255, 255, .93);
      border: 1px solid rgba(0, 0, 0, .12);
      box-shadow: 0 3px 9px rgba(0, 0, 0, .15);
    }

    .tela-topicos-lista {
      margin: 0;
      padding: 0;
      list-style: none;
      line-height: 1.5;
    }

    .tela-topicos-licao {
      margin: 0 0 8px;
    }

    .tela-topicos-titulo-licao,
    .tela-topicos-item {
      display: block;
      width: 100%;
      padding: 3px 6px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      line-height: inherit;
      cursor: pointer;
    }

    .tela-topicos-titulo-licao {
      font-weight: bold;
    }

    .tela-topicos-item {
      padding-left: 24px;
    }

    .tela-topicos-html .bloqueado {
      opacity: .45;
      cursor: not-allowed !important;
      pointer-events: none;
    }

    .tela-topicos-html .link {
      cursor: pointer;
    }

    .tela-topicos-html button:hover {
      color: #8b6500;
    }

    @media (max-width: 600px) {
      .tela-topicos-html {
        min-height: 360px;
      }

      .tela-topicos-cabecalho,
      .tela-topicos-conteudo {
        width: 90%;
      }

      .tela-topicos-cabecalho {
        margin-top: 30%;
        min-height: 36px;
        padding: 4px 10px;
      }

      .tela-topicos-conteudo {
        max-height: 58%;
        padding: 10px;
      }

      .tela-topicos-titulo-licao,
      .tela-topicos-item {
        padding-top: 5px;
        padding-bottom: 5px;
      }
    }
  </style>

  <div class="tela-topicos-cabecalho">TÓPICOS</div>

  <div class="tela-topicos-conteudo">
    <ol class="tela-topicos-lista">
      <li class="tela-topicos-licao" ng-repeat="licao in oas track by $index" ng-if="$index !== 0"
        ng-class="classeLicaoTopicos($index)">
        <button type="button" class="tela-topicos-titulo-licao"
          ng-click="classeLicaoTopicos($index) !== 'bloqueado' && iniciarLicao($index)">
          {{$index}} &mdash; {{licao.label}}
        </button>
        <ol class="tela-topicos-lista">
          <li ng-repeat="topico in licao.arquivos track by $index" ng-class="classeTopico($parent.$index, $index)">
            <button type="button" class="tela-topicos-item" id="licao{{$parent.$index}}_topico{{$index + 1}}"
              ng-click="classeTopico($parent.$index, $index) !== 'bloqueado' && iniciarLicao($parent.$index, $index)">
              {{$parent.$index}}.{{$index + 1}} &mdash; {{topico.nome}}
            </button>
          </li>
        </ol>
      </li>
    </ol>
  </div>
</div>
