<style>
    .barra-navegacao-topicos {
        position: relative;
        display: flex;
        align-items: flex-start;

        width: 100%;
        max-width: 1016px;
        height: 60px;
        margin: 0 auto;

        overflow: hidden;
        box-sizing: border-box;

        background: linear-gradient(to bottom,
                #6f6f6f 0%,
                #8f8f8f 100%);

        border-top: 8px solid #361a15;
    }

    /* Estilo comum dos botões */
    .barra-navegacao-topicos .nav3-botao {
        position: absolute;
        top: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        height: 59px;
        padding: 0;

        border: 0;
        border-radius: 0;

        background: #cf583a;
        color: #ffffff;

        cursor: pointer;
        box-sizing: border-box;
    }

    .barra-navegacao-topicos .nav3-botao:hover {
        filter: brightness(1.1);
    }

    .barra-navegacao-topicos .nav3-botao:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: -4px;
    }

    /* Botão Tópicos */
    .barra-navegacao-topicos .nav3-topicos {
        left: 12px;
        width: 98px;

        border-left: 4px solid #eabe9b;
        border-right: 4px solid #eabe9b;
    }

    /* Ícone de tópicos */
    .nav3-icone-topicos {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;

        width: 40px;
        height: 32px;
    }

    .nav3-documento {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;

        width: 23px;
        height: 27px;
        padding: 3px;

        border: 2px solid #ffffff;
        box-sizing: border-box;
    }

    .nav3-documento span {
        display: block;
        width: 100%;
        height: 2px;
        background: #ffffff;
    }

    .nav3-seta-volta {
        position: absolute;
        right: -3px;
        top: 0;

        font-family: Arial, sans-serif;
        font-size: 23px;
        font-weight: bold;
        line-height: 1;

        background: #cf583a;
    }

    /* Botão Sair */
    .barra-navegacao-topicos .nav3-sair {
        right: 12px;
        width: 98px;

        background: #c72f3b;

        border-left: 4px solid #eabe9b;
        border-right: 4px solid #eabe9b;
    }

    /* Ícone de saída */
    .nav3-icone-sair {
        font-family: Arial, sans-serif;
        font-size: 32px;
        font-weight: bold;
        line-height: 1;
    }

    /* Responsividade */
    @media (max-width: 768px) {
        .barra-navegacao-topicos {
            height: 50px;
            border-top-width: 5px;
        }

        .barra-navegacao-topicos .nav3-botao {
            height: 49px;
            width: 58px;
        }

        .barra-navegacao-topicos .nav3-topicos {
            left: 0;
        }

        .barra-navegacao-topicos .nav3-sair {
            right: 0;
        }

        .nav3-icone-topicos {
            transform: scale(0.85);
        }

        .nav3-icone-sair {
            font-size: 26px;
        }
    }
</style>
<div class="barra-navegacao-topicos">

    <!-- Botão Tópicos -->
    <button type="button" class="nav3-botao nav3-topicos" ng-click="topicos()" aria-label="Voltar aos tópicos">

        <span class="nav3-icone-topicos">
            <span class="nav3-documento">
                <span></span>
                <span></span>
                <span></span>
            </span>
            <span class="nav3-seta-volta">↪</span>
        </span>

    </button>

    <!-- Botão de saída -->
    <button type="button" class="nav3-botao nav3-sair" ng-click="sair()" aria-label="Sair">

        <span class="nav3-icone-sair">⇥</span>

    </button>

</div>
